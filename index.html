      var delta = target - (from % (2 * Math.PI));
      while (delta <= 0) delta += 2 * Math.PI;
      an.from = from;
      an.to = from + delta + 4 * Math.PI;         // two full turns, then settle
      an.t = 0;
      an.dur = 0.38;
    } else {
      an.rot = target;
      an.t = 1;
    }
    an.index = res.indices[i];
    an.flash = animate ? 0 : 0.12;
  }
  if (animate) { Audio2.play('roll'); G.pendingLand = res; }
  else landResult(res);
  markDirty();
  return res;
}

/* Payout feedback is owed to the throw, not to the tween. The settle animation
   is 380 ms but from roller Lv1 the rolls arrive every 370 ms or less, so a hook
   that waited for the tween simply never fired. Whichever comes first - the
   tween landing or the next throw - pays the previous one. */
function flushLand() {
  if (!G.pendingLand) return;
  var res = G.pendingLand;
  G.pendingLand = null;
  landResult(res);
}

function landResult(res) {
  /* Haptics, the chime and the screen sparkle ride the SAME 8/s budget as the
     floats. At roller L11 this function runs about 58 times a second: an
     unthrottled 128 ms vibration pattern started eight times a second is one
     continuous buzz, the three-oscillator jackpot chime overlaps itself
     permanently, and G.sparkle is re-armed faster than it decays so the coin
     glint never turns off. */
  var cue = G.floatBudget === 0;
  /* The glow and the tag come from the throw that was PAID, never from a fresh
     look at the dice. flushLand can run a tween or a whole + SIDE purchase after
     the throw, so recomputing the match here glowed a die that was not paid
     double - and printed the old ×2 next to three glowing dice. Guarded on
     length because a result can outlive the die count for one frame after + DIE.
     res.matched already excludes any die sitting on its own jackpot face, so a
     tag is only ever drawn over coins that were actually multiplied. */
  var matched = (res.matched && res.indices.length === st.dice.length) ? res.matched : null;
  /* every cue reads the SAME merged data the float does, so a jackpot that
     landed on any roll but the last of a 54/s frame still sparkles and chimes */
  var f = res.feed || res;
  var i, an;
  for (i = 0; i < st.dice.length; i++) {
    an = unitAnim(i);
    an.flash = 0.12;
    if (matched && matched.indexOf(i) >= 0) an.glow = 0.5;
  }
  var jack = f.types.indexOf('jack') >= 0;
  if (matched && matched.length >= 2) {
    /* show, don't tell: both dice glow, the tag bursts between them, and only
       then do the per-die floats rise with the already-multiplied amounts */
    var a = dieGeom(matched[0]), b = dieGeom(matched[matched.length - 1]);
    G.burst = {
      t: 0,
      x: (a.x + b.x) / 2,
      y: Math.min(a.top, b.top) - 18,
      text: (matched.length >= 3 ? THEME.strings.triples : THEME.strings.doubles) +
            ' ×' + res.combo
    };
    if (cue) buzz(18);
  }
  /* f carries the summed payouts of every roll the frame resolved, so nothing
     the auto-roller banked is missing from the numbers on screen */
  payFeedback(f, matched ? 0.18 : 0);
  var mm = Math.max(1e-9, res.mult || 1);
  for (i = 0; i < st.dice.length && i < f.paid.length; i++) {
    if (!(f.paid[i] > 0)) continue;
    spawnBurst(i, f.paid[i] / mm / Math.max(1e-9, E.dieExpected(st.dice[i])), f.types[i]);
  }
  if (cue) {
    if (jack) { G.sparkle = 0.9; Audio2.play('jack'); buzz([12, 40, 12, 40, 24]); }
    else Audio2.play('land', f.total || res.total);
  }
}

function floatColor(v, type) {
  var P = THEME.palette;
  if (hotActive()) return P.hot;
  if (type === 'jack' || v > 10000) return P.gold;
  if (v > 100) return P.tint;
  return P.fg;
}

/* Floats are per-die and anchored to that die's screen x, rising over 700 ms.
   The rise is relative to the canvas height so the number is never clipped on a
   short viewport. */
function spawnFloats(paid, types, delay) {
  var i, g;
  /* Lanes, not jitter. A manual tap landing next to an auto-roll put two numbers
     on the same pixels and "+28" read as "+2". Five lanes, not three: a float
     lives 700 ms and a human tapping at their own pace lands four to six inside
     that window, so three lanes still stacked two deep and the burst read as a
     smear. Five separates every float that can be on screen at once. */
  G.floatLane = (G.floatLane + 1) % 5;
  var lane = G.floatLane;
  var step;
  for (i = 0; i < paid.length && i < st.dice.length; i++) {
    if (!(paid[i] > 0)) continue;
    g = dieGeom(i);
    step = Math.min(30, Math.max(14, g.R * 0.36));
    G.floats.push({
      x: g.x + (lane - 2) * step,
      y: Math.max(16, g.top - 10) - lane * 7,
      t: -(delay || 0) / 0.7,
      /* fmt() floors, which is right for a balance the player must not be told
         they have more of than they do - but wrong for a payout: after one
         Recast M is 3.40 and a face worth 3 pays 10.20, so every float on screen
         under-reported by up to a coin while the counter climbed the true
         amount. Rounded here, floored there, each correct for its own job. */
      text: (types[i] === 'jack' ? '★ ' : '+') + E.fmt(Math.round(paid[i])),
      color: floatColor(paid[i], types[i]),
      size: types[i] === 'jack' ? 26 : 22
    });
  }
  /* A hard ceiling on what can be on screen: a stall that resolves a burst of
     throws must never turn the stage into a wall of numerals. */
  while (G.floats.length > 15) G.floats.shift();
}

/* When several payouts on one die are merged into a single float, the float
   takes the BEST type it saw: jack > x2 > normal. Only overwriting on a jackpot
   meant a slot already holding 'normal' could never be replaced by a later
   'x2', so the float and the dust painted in --fg instead of the cool --tint
   that is most of what tells the player a doubled side just paid. */
var TYPE_RANK = { normal: 0, x2: 1, jack: 2 };
function bestType(a, b) {
  if (!a) return b;
  if (!b) return a;
  return (TYPE_RANK[b] || 0) > (TYPE_RANK[a] || 0) ? b : a;
}

/* Above FAST_ROLL_THRESHOLD the floats are throttled to 8/s and the payouts they
   skipped are merged into the next one, so nothing is ever silently dropped. */
function payFeedback(res, delay) {
  if (G.floatBudget > 0) {
    if (!G.merge) G.merge = { paid: [], types: [], total: 0 };
    var i;
    for (i = 0; i < res.paid.length; i++) {
      G.merge.paid[i] = (G.merge.paid[i] || 0) + res.paid[i];
      G.merge.total += res.paid[i];
      G.merge.types[i] = bestType(G.merge.types[i], res.types[i]);
    }
    return;
  }
  G.floatBudget = floatGap();
  spawnFloats(res.paid, res.types, delay);
}

/* Seconds before the next float may spawn. Every spawn is one float PER DIE
   and each lives 0.7 s, so with two or three dice tapping plus a roller could
   push past the 15-float ceiling and cut floats off mid-rise: the gap keeps
   (dice x 0.7 s / gap) under 15. One die below the fast threshold is never
   throttled. */
function floatGap() {
  var n = st.dice.length;
  return Math.max(G.fastMode ? 0.125 : 0, n > 1 ? 0.05 * n : 0);
}

function flushMerged() {
  if (!G.merge) return;
  var m = G.merge;
  G.merge = null;
  G.floatBudget = floatGap();
  spawnFloats(m.paid, m.types, 0);
  /* one cue for the whole merged batch, not one per landing */
  if (m.types.indexOf('jack') >= 0) {
    G.sparkle = 0.9; Audio2.play('jack'); buzz([12, 40, 12, 40, 24]);
  } else {
    Audio2.play('land', m.total);
  }
}

/* Landing dust: count and radius scale with how big the payout was against this
   die's own average, so a good face reads as a good face without a word. */
function spawnBurst(i, strength, type) {
  var g = dieGeom(i);
  var n = Math.max(3, Math.min(22, Math.round(3 + strength * 5)));
  var P = THEME.palette;
  var k, a, sp;
  for (k = 0; k < n; k++) {
    a = -Math.PI * (0.15 + 0.7 * Math.random());
    sp = (40 + Math.random() * 70) * (0.6 + Math.min(2, strength) * 0.35);
    G.particles.push({
      x: g.x + (Math.random() - 0.5) * g.R * 0.7,
      y: groundY() - 1,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      t: 0,
      life: 0.35 + Math.random() * 0.3,
      r: 1 + Math.random() * 2,
      color: type === 'jack' ? P.gold : type === 'x2' ? P.tint : P.dim
    });
  }
  if (G.particles.length > 260) G.particles.splice(0, G.particles.length - 260);
}

/* ---- purchases ------------------------------------------------------------ */

/* draw() is what normally fills in each die's screen anchor, and update() - which
   can auto-roll and spawn a float - runs before it. A die bought this frame had
   no anchor yet, so its first payout was printed at the canvas origin while the
   others were printed at their old, pre-rebase positions. */
function seedGeom() {
  var count = st.dice.length, scale = fitScale(st.dice), i, g, R;
  for (i = 0; i < count; i++) {
    g = dieGeom(i);
    R = radiusFor(st.dice[i].n, count) * scale;
    g.x = unitX(i, count);
    g.R = R;
    g.y = groundY() - bottomOf(st.dice[i].n, R, 0);
    g.top = g.y - R;
  }
}

function tryBuy(kind) {
  wake();
  /* a quick second + SIDE tap inside the 700 ms settle is not dropped: it buys
     and retargets the running morph from wherever it is, which check.js proves
     happens without a jump */
  if (G.panelOpen || (frozen() && kind !== 'side')) return;
  if (kind === 'recast') { openRecast(); return; }
  if (!E.canBuy(st, kind)) return;
  var before = maxRollNow();
  var info = E.buy(st, kind);
  if (!info) return;
  if (kind === 'side' && G.morphs[info.unit]) {
    /* a re-tap while this die is still growing: chain onto the swell with one
       settle, like a hold step - no new freeze, no re-shake, so machine-gun
       tapping never stretches the 700 ms freeze into a frozen stage */
    startMorph(info.unit, info.n, true);
    settleMorph(info.unit);
    Audio2.play('tick', 0);
    buzz(6);
  } else if (kind === 'side') {
    startMorph(info.unit, info.n, false);
    Audio2.play('grow');
    buzz([12, 30, 18]);
    G.shake = 0.22;
    G.freezeUntil = clock() + 0.7;
  } else {
    Audio2.play(kind === 'jack' ? 'jack' : 'buy');
    buzz(14);
    G.shake = 0.1;
    if (kind === 'unit') {
      /* morph outlines are stored at the old dice count's radius; a settle
         still running would draw its die ~39% too big in the narrower slot */
      for (var mi = 0; mi < G.morphs.length; mi++) G.morphs[mi] = null;
      unitAnim(st.dice.length - 1).rot = 0; seedGeom();
    }
    if (kind === 'jack' || kind === 'tier3') G.sparkle = 0.7;
    firstFaceNotice(kind, info);
  }
  G.maxRollTarget = maxRollNow();
  if (G.maxRollTarget !== before) G.maxRollTick = 0.7;
  save();
  refreshShop();
  wake();
}

/* Once each, the first time a special face is ever bought: the die now carries
   a coloured pip the player has never seen, and nothing else on screen says
   which mark belongs to which purchase. After that the pip and the float colour
   carry it on their own. */
function firstFaceNotice(kind, info) {
  if (kind === 'x2' && info.k === 1) {
    notice('Blue faces pay ×' + st.dice[info.unit].tier + '. Watch for the blue pip on the rim.');
  } else if (kind === 'jack' && info.tier === 1) {
    notice('The gold face pays ×' + E.jackMult(1) + ' the die average. It is face 1, marked gold.');
  }
}

/* ---- the + SIDE morph -----------------------------------------------------
   One morph per die, stored UNSCALED and in the die's own frame: draw() scales
   it by fitScale and turns it by whatever rotation the die has right now, so a
   die can keep rolling - or spinning in fast mode - while it grows.

   Chained morphs. A purchase that lands on a die which is already morphing
   never restarts from the old side count and never snaps: the new morph starts
   from the outline as it is drawn at this instant and heads for the new one.
   Thirty purchases in two seconds are one continuous swell. */
var MORPH_PTS = 240;

function morphEase(mo, t) { return mo.ease === 'back' ? easeOutBack(t) : easeOutCubic(t); }

/* The outline as it is being drawn right now, unscaled and unrotated. */
function morphNow(mo) {
  var e = morphEase(mo, Math.min(1, mo.t)), out = new Array(mo.from.length), q, a, b;
  /* the settle's swell lives here, so a morph chained off a swelling settle
     still starts exactly where it was drawn: 0 at both ends, +5% mid-way */
  var sw = mo.swell ? 1 + 0.05 * Math.sin(Math.PI * Math.min(1, mo.t)) : 1;
  for (q = 0; q < mo.from.length; q++) {
    a = mo.from[q]; b = mo.to[q];
    out[q] = [(a[0] + (b[0] - a[0]) * e) * sw, (a[1] + (b[1] - a[1]) * e) * sw];
  }
  return out;
}

function rotatePts(pts, ang) {
  if (!ang) return pts;
  var c = Math.cos(ang), s = Math.sin(ang), out = new Array(pts.length), q;
  for (q = 0; q < pts.length; q++) {
    out[q] = [pts[q][0] * c - pts[q][1] * s, pts[q][0] * s + pts[q][1] * c];
  }
  return out;
}

function anyMorph() {
  for (var i = 0; i < G.morphs.length; i++) if (G.morphs[i]) return true;
  return false;
}

/* A roll in flight when its die grows was aimed at face k of the OLD shape and
   would land tilted on the new one. Re-aim the end of the tween by the angle
   between the two, and move its start so the rotation drawn THIS frame does not
   change: from + (to - from) * e must still equal rot. */
function steerRoll(an, shift) {
  if (!shift) return;
  var e = rollEase(an.t), to2 = an.to + shift;
  if (1 - e > 1e-3) an.from = (an.rot - to2 * e) / (1 - e);
  else an.from += shift;
  an.to = to2;
}

/* Keeps the die's rotation honest across a side purchase and returns the
   outline the new morph should start from, in the frame it will be drawn in. */
function rebaseForGrowth(unitIndex, newSides, cur, hadMorph) {
  var an = unitAnim(unitIndex), oldSides = newSides - 1;
  if (G.fastMode) {                       // spin phase drives rot; nothing to steer
    if (an.snap > 0) an.snapRot = rotationFor(newSides, an.index);
    return cur;
  }
  if (an.t < 1) {                         // mid-roll: land flat on the NEW shape
    steerRoll(an, rotationFor(newSides, an.index) - rotationFor(oldSides, an.index));
    return cur;
  }
  if (!hadMorph) {
    /* At rest on a settled polygon: keep the landed face under the marker (the
       x2 / jackpot wedges and pips are drawn through the morph, so going back
       to face 0 made them jump) and carry the outline round by the difference
       so this frame draws exactly what the last one did. */
    var base = rotationFor(newSides, an.index), old = an.rot;
    an.rot = base + Math.round((old - base) / (2 * Math.PI)) * 2 * Math.PI;
    an.snap = 0;
    return rotatePts(cur, old - an.rot);
  }
  /* At rest mid-swell: the outline is between two shapes and not symmetric, so
     rotation is NOT free. Take the new shape's nearest flat and carry the
     outline round by the same small angle, at most half a face. */
  var step = 2 * Math.PI / Math.max(1, newSides);
  var q = Math.round(an.rot / step), after = q * step, d = after - an.rot;
  an.rot = after;
  an.index = newSides > 1 ? ((-q % newSides) + newSides) % newSides : 0;
  an.snap = 0;
  return rotatePts(cur, -d);
}

/* `chain` is true for a hold-to-buy purchase: a short no-overshoot step, no
   ring, numerals held back until the settle. A tap is the full 600 ms money
   shot, exactly as before. */
function startMorph(unitIndex, newSides, chain) {
  var count = st.dice.length;
  var prev = G.morphs[unitIndex];
  var cur = prev ? morphNow(prev)
                 : resample(outline(newSides - 1, radiusFor(newSides - 1, count)), MORPH_PTS);
  G.morphs[unitIndex] = {
    t: 0,
    dur: chain ? HOLD.MORPH_S : HOLD.SETTLE_S,
    ease: chain ? 'out' : 'back',
    quiet: !!chain,
    hold: !!chain,                        // parked at t=1 until the hold ends
    from: rebaseForGrowth(unitIndex, newSides, cur, !!prev),
    to: resample(outline(newSides, radiusFor(newSides, count)), MORPH_PTS),
    newFace: newSides - 1
  };
}

/* The single flourish at the end of a hold: from wherever the swell is, a
   600 ms easeOutBack onto the final shape, with the ring, the stamp and the
   numerals fading back in. */
function settleMorph(unitIndex) {
  var mo = G.morphs[unitIndex];
  if (!mo) return;
  /* from exactly wherever the swell is drawn, so the first frame never jumps.
     The last chained step has usually parked on its target already, so the
     flourish is a separate +5% swell-and-return (mo.swell, in morphNow) */
  mo.from = morphNow(mo);
  mo.swell = true;
  mo.fromHold = true;                     // the value window never blinks out
  mo.t = 0;
  mo.dur = HOLD.SETTLE_S;
  mo.ease = 'back';
  mo.quiet = false;
  mo.hold = false;
}

/* ---- hold to buy ----------------------------------------------------------
   Press and hold a repeatable card and it keeps buying: the first repeat at
   DELAY_MS, then RATE_START a second ramping linearly to RATE_END over
   RAMP_MS. A tap still buys exactly one, on release. Presentation state only -
   every purchase is an ordinary E.buy and every number still comes from ECON. */
var HOLD = {
  DELAY_MS: 350,
  RATE_START: 4,          // purchases per second when the repeat begins
  RATE_END: 15,           // ... and after RAMP_MS of holding
  RAMP_MS: 2000,
  MAX_PER_FRAME: 3,       // a stalled frame never dumps a backlog of purchases
  HAPTIC_GAP_MS: 84,      // at most ~12 buzzes a second
  TICK_GAP_MS: 60,        // at most ~16 ticks a second
  MORPH_S: 0.2,           // one chained step of the swell
  SETTLE_S: 0.6,          // the money shot, and the flourish that ends a hold
  SLIDE_PX: 12,           // before the repeat starts, sliding this far cancels
  KINDS: { side: true, x2: true, jack: true, roller: true }
};

/* One live press across the whole shop, so a second finger can never start a
   second repeater or buy something else under the first. */
var shopPress = null;

function holdRate(ms) {
  var k = Math.max(0, Math.min(1, ms / HOLD.RAMP_MS));
  return HOLD.RATE_START + (HOLD.RATE_END - HOLD.RATE_START) * k;
}

function beginHold(kind, press) {
  if (!HOLD.KINDS[kind] || G.hold) return;
  var t = (kind === 'x2' || kind === 'jack') ? E.targetFor(st, kind) : null;
  G.hold = { kind: kind, press: press, node: shopNodes[kind].root,
             t0: performance.now(), live: false, liveAt: 0, next: 0, count: 0,
             unit: t ? t.unit : -1 };
}

/* One purchase from the repeater. False means stop: out of coins, the card has
   left the shop or locked, or an x2 / jackpot card now points at another die. */
function repeatBuy(h) {
  var n = shopNodes[h.kind];
  if (!n || n.root.hidden || n.root.classList.contains('locked')) return false;
  if (G.panelOpen || !E.canBuy(st, h.kind)) return false;
  if (h.unit >= 0) {
    var t = E.targetFor(st, h.kind);
    if (!t || t.unit !== h.unit) return false;
  }
  var info = E.buy(st, h.kind);
  if (!info) return false;
  h.count += 1;
  /* only a hold that actually bought something swallows the release: a slow
     tap on a card that was a few coins short still buys one when it lifts */
  if (h.press) h.press.repeated = true;
  if (h.kind === 'side') startMorph(info.unit, info.n, true);
  else if (h.kind === 'jack' && G.sparkle < 0.2) G.sparkle = 0.5;   // merged glints
  firstFaceNotice(h.kind, info);
  var now = performance.now();
  if (now - G.lastTick >= HOLD.TICK_GAP_MS) { G.lastTick = now; Audio2.play('tick', h.count - 1); }
  if (now - G.lastBuzz >= HOLD.HAPTIC_GAP_MS) { G.lastBuzz = now; buzz(6); }
  markDirty();
  refreshShop();
  return true;
}

/* Runs every frame from update(). The loop stays awake while a hold exists. */
function holdStep() {
  var h = G.hold;
  if (!h) return;
  if (G.panelOpen) { endHold(true); return; }
  var now = performance.now();
  if (!h.live) {
    if (now - h.t0 < HOLD.DELAY_MS) return;
    h.live = true;
    h.liveAt = now;
    h.next = now;
    h.node.classList.add('holding');
    G.freezeUntil = 0;                      // no 700 ms freeze while repeating
  }
  var n = 0;
  while (now >= h.next && n < HOLD.MAX_PER_FRAME) {
    n += 1;
    if (!repeatBuy(h)) { endHold(true); return; }
    h.next += 1000 / holdRate(h.next - h.liveAt);
  }
  if (now - h.next > 250) h.next = now;     // never bank a backlog after a stall
}

/* Stops the repeater. With `settle`, and if it bought anything, plays the one
   flourish the whole hold earned: the settle morph, one grow chord, one shake. */
function endHold(settle) {
  var h = G.hold;
  if (!h) return;
  G.hold = null;
  h.node.classList.remove('holding');
  var i, grew = false;
  for (i = 0; i < G.morphs.length; i++) {
    if (G.morphs[i] && G.morphs[i].hold) { grew = true; settleMorph(i); }
  }
  if (!settle || h.count === 0) return;
  if (grew) {
    Audio2.play('grow');
    buzz([12, 30, 18]);
    G.shake = 0.16;
  } else {
    Audio2.play(h.kind === 'jack' ? 'jack' : 'buy');
    buzz(14);
    G.shake = 0.08;
  }
  save();
  refreshShop();
  wake();
}

/* ---- recast --------------------------------------------------------------- */

function openRecast() {
  if (!E.unlocked(st, 'recast')) return;
  /* Show, don't tell: the multiplier change is the hero, then one row of what
     stays and one of what goes, as icons and numbers. The "after" numbers come
     from running ECON's own recast on a copy, so the screen shows exactly what
     the button will do and cannot drift from it. */
  var after = E.clone(st);
  var gain = E.recast(after);
  $('#rcRun').textContent = 'RUN ' + (st.recasts + 1) + '/' + E.K.MAX_RECASTS;
  $('#rcFrom').textContent = '×' + E.runMult(st).toFixed(2);
  $('#rcTo').textContent = '×' + E.runMult(after).toFixed(2);
  $('#rcGain').innerHTML = RC_ICON.shard + '<span>+' + gain + '</span>';
  var roller = st.roller >= 0
    ? rcChip(RC_ICON.roller, 'Lv' + (st.roller + 1) + '→' + (after.roller + 1)) : '';
  $('#rcKeep').innerHTML = '<span class="rc-tag">KEEP</span>' +
    rcChip(RC_ICON.shard, String(after.shards)) +
    rcChip(RC_ICON.die, '×' + after.slots) +
    roller +
    rcChip(RC_ICON.skin, '');
  $('#rcReset').innerHTML = '<span class="rc-tag">RESET</span>' +
    rcChip(RC_ICON.die, '1') +
    rcChip(RC_ICON.coin, '0') +
    rcChip('', '×2 ★');
  openPanel('#recastPanel');
}

var RC_ICON = {
  shard: '<svg viewBox="0 0 16 16"><path d="M8 1.6 14 6.2 8 14.4 2 6.2Z M2 6.2h12"/></svg>',
  die: '<svg viewBox="0 0 16 16"><path d="M8 1.8 13.4 4.9v6.2L8 14.2 2.6 11.1V4.9Z"/></svg>',
  roller: '<svg viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11z M6.2 2.5v11 M9.8 2.5v11"/></svg>',
  skin: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.7 1.8-1.7H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3z"/><circle cx="7.6" cy="12.4" r="1.1"/><circle cx="9.9" cy="8.2" r="1.1"/><circle cx="14.6" cy="7.8" r="1.1"/></svg>',
  coin: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8"/><path d="M8 5v6"/></svg>'
};

function rcChip(icon, text) {
  return '<span class="rc-chip">' + icon + (text ? '<span>' + text + '</span>' : '') + '</span>';
}

function doRecast() {
  E.recast(st);
  resetVisualState();
  G.maxRollTarget = maxRollNow();
  G.maxRollShown = G.maxRollTarget;
  G.shownCoins = 0;
  st.adsUnlocked = true;              // ads never appear before a completed run
  closePanel('#recastPanel');
  Audio2.play('grow');
  buzz([20, 40, 20, 40]);
  save();
  refreshShop();
  wake();
}

/* ---- hot hand -------------------------------------------------------------
   Buff and cooldown live on absolute wall time and survive a reload. On a
   page-local clock they reset to zero on every load, so the cooldown was
   unenforceable: watch, take the x3, refresh, watch again. */
/* Milliseconds of buff left, and the only place the GAME layer reads hotUntil.
   sanitise()
   clamps it on load, but load is not enough: winding the device clock back an
   hour mid-session left Date.now() an hour below hotUntil and handed out x3 on
   every roll - up to 54 a second - until the next reload. Re-clamping at read
   time costs nothing (this runs every frame anyway) and bounds the buff at its
   own length no matter what the clock does. E.multiplier reads st.hotUntil
   directly, and refreshHot calls hotState() every frame, so the clamp lands
   before any payout can use it. */
function hotLeftMs() {
  var now = Date.now();
  var left = st.hotUntil - now;
  var max = E.K.HOT_DURATION_S * 1000;
  if (left > max) { st.hotUntil = now + max; left = max; }
  return left;
}

function hotState() {
  var t = Date.now();
  if (hotLeftMs() > 0) return 'live';
  if (!st.adsUnlocked) return 'hidden';
  if (st.roller < 0) return 'hidden';
  if (t < st.hotReadyAt) return 'cooling';
  return 'ready';
}

function startHot() {
  var now = Date.now();
  st.hotUntil = now + E.K.HOT_DURATION_S * 1000;
  st.hotReadyAt = now + E.K.HOT_COOLDOWN_S * 1000;
  Audio2.play('buy');
  /* The chip counts down and the dice wear a badge, but neither says what the
     buff is worth the first time it fires. One line, once per use. */
  notice(THEME.strings.hot + ': every payout pays ×' + E.K.HOT_MULT +
         ' for ' + E.fmtTime(E.K.HOT_DURATION_S) + '.');
  save();
  wake();
}

function onHotChip() {
  if (hotState() !== 'ready') return;
  runRewarded('HOT HAND', {}, startHot);
}

/* ---- offline -------------------------------------------------------------- */

function creditCoins(amount) {
  if (!(amount > 0)) return;
  st.coins = E.add(st.coins, amount);
  st.runCoins = E.add(st.runCoins, amount);
  st.lifetime = E.add(st.lifetime, amount);
}

/* Two rules.
   1. The claim ACCUMULATES INTO THE SAVE. Every save() advances savedAt, so a
      claim held only in memory was destroyed by the next background cycle - and
      a second handleReturn overwrote four hours of income with a few hundred.
   2. Under OFFLINE_MIN_S the seconds are granted silently rather than dropped.
      The loop is cancelled while the page is hidden, so those seconds are not
      earned in game either. */
function handleReturn(secondsAway) {
  if (secondsAway >= E.K.ADS_RETURN_GATE_S) st.adsUnlocked = true;
  var amount = E.offlineEarnings(st, secondsAway, false);
  if (secondsAway < E.K.OFFLINE_MIN_S || amount < 1) {
    creditCoins(amount);
  } else {
    st.pendingOffline = E.add(st.pendingOffline, amount);
    /* The AMOUNT is capped per claim, so the seconds have to be too or the card
       claims the player was paid for four hours when two three-hour absences
       paid them for six. The raw away time is kept separately for the "of the
       Nh you were away" clause. */
    st.pendingOfflineSeconds += Math.min(secondsAway, E.K.OFFLINE_CAP_S);
    /* Only time that actually produced a pending claim. Counting every short
       background return here banked phantom away time against no coins at all -
       a hundred 20-second app switches made the next genuine two-hour absence
       read "for 2h 0m of the 2h 33m you were away" - and it is also what the
       ad-doubled amount is computed from, so it has to mean exactly one thing. */
    st.pendingOfflineAway += secondsAway;
  }
  markDirty();
  if (st.pendingOffline >= 1) showOfflineCard();
}

function showOfflineCard() {
  var paid = st.pendingOfflineSeconds;
  var away = Math.max(st.pendingOfflineAway, paid);
  $('#offAmt').textContent = '+' + E.fmt(st.pendingOffline);
  $('#offLine').textContent = 'Your roller ran at ' + Math.round(E.K.OFFLINE_RATE * 100) +
    '% speed for ' + E.fmtTime(paid) +
    (away > paid + 1 ? ' of the ' + E.fmtTime(away) + ' you were away.'
                     : ' while you were away.');
  $('#offDouble').style.display = st.adsUnlocked ? '' : 'none';
  $('#offDouble').disabled = false;
  openPanel('#offlinePanel');
}

function collectOffline() {
  creditCoins(st.pendingOffline);
  st.pendingOffline = 0;
  st.pendingOfflineSeconds = 0;
  st.pendingOfflineAway = 0;
  $('#offDouble').disabled = false;
  closePanel('#offlinePanel');
  save();
  refreshShop();
  wake();
}

/* The reward is fixed at the moment it is offered: the payload carries the exact
   amount the card was showing. Re-pricing the old away time against today's
   state, which is what a Math.max against offlineEarnings did, paid a resumed
   reward against bigger dice and a bigger multiplier than it was ever worth -
   and a crash resume runs AFTER handleReturn has already banked a fresh claim,
   so the two were being mixed. The bonus is added to whatever is pending now. */
/* What the ad is actually worth: ECON re-prices the SAME away time at the ad
   rate and the ad cap. Doubling the already-4-hour-capped figure in game code
   paid exactly half the spec for any absence over four hours and left
   OFFLINE_CAP_AD_S dead - and it was the one place the game computed currency
   outside ECON. */
function offlineDoubled(st2) {
  /* a save written before pendingOfflineAway existed falls back to the paid
     seconds, which re-prices to exactly twice the claim - the old behaviour */
  var away = Math.max(st2.pendingOfflineAway || 0, st2.pendingOfflineSeconds || 0);
  return E.offlineEarnings(st2, away, true);
}

function applyOfflineDouble(payload) {
  var base = payload && payload.base > 0 ? payload.base : st.pendingOffline;
  var offered = payload && payload.full > 0 ? payload.full : offlineDoubled(st);
  /* If the pending claim shrank while a crashed ad was resuming, the bonus
     shrinks with it rather than being paid against coins that are not there. */
  var share = base > 0 ? Math.min(1, st.pendingOffline / base) : 0;
  var full = E.add(st.pendingOffline, Math.max(0, offered - base) * share);
  if (!(full > 0)) return;
  st.pendingOffline = full;
  $('#offAmt').textContent = '+' + E.fmt(full);
  collectOffline();
}

function onOfflineDouble() {
  $('#offDouble').disabled = true;
  runRewarded('OFFLINE DOUBLE',
              { seconds: st.pendingOfflineSeconds, away: st.pendingOfflineAway,
                base: st.pendingOffline, full: offlineDoubled(st) },
              applyOfflineDouble);
}

/* ---- panels --------------------------------------------------------------- */

function openPanel(sel) { $(sel).classList.add('show'); G.panelOpen = true; }
function closePanel(sel) {
  $(sel).classList.remove('show');
  G.panelOpen = document.querySelectorAll('.panel.show').length > 0;
  wake();
}

/* ---- shop ----------------------------------------------------------------
   No tabs, no menu, at most four cards: + SIDE pinned top, RECAST pinned bottom
   when it is lit, and the two cheapest unlocked-or-nearly of the middle group.
   Locked cards show a ghosted preview of what you would get. */

var SHOP = [
  { kind: 'side', name: THEME.strings.addSide, order: 0 },
  { kind: 'x2', name: THEME.strings.x2, order: 4 },
  { kind: 'jack', name: THEME.strings.jack, order: 4 },
  { kind: 'tier3', name: THEME.strings.tier3, order: 4 },
  { kind: 'roller', name: THEME.strings.roller, order: 4 },
  { kind: 'unit', name: THEME.strings.addUnit, order: 4 },
  { kind: 'recast', name: THEME.strings.recast, order: 9 }
];

var MIDDLE = ['x2', 'jack', 'tier3', 'roller', 'unit'];
var shopNodes = {};
var glyphCache = {};

function polyGlyph(sides) {
  if (glyphCache[sides]) return glyphCache[sides];
  var pts = polyPoints(sides, 13, 0), i, d = 'M';
  for (i = 0; i < pts.length; i++) {
    d += pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1) + (i < pts.length - 1 ? ' L' : ' Z');
  }
  glyphCache[sides] = d;
  return d;
}

function glyphPath(kind, target) {
  if (kind === 'side') {
    var sides = target ? target.n : 12;
    return polyGlyph(Math.max(3, Math.min(sides, 12)));
  }
  if (kind === 'x2') return polyGlyph(8) + ' M-5.5-5.5 L5.5 5.5 M5.5-5.5 L-5.5 5.5';
  if (kind === 'jack') return 'M0-14 L4.1-4.6 L14-4.3 L6.2 1.7 L9 11.3 L0 5.6 L-9 11.3 L-6.2 1.7 L-14-4.3 L-4.1-4.6 Z';
  if (kind === 'tier3') return polyGlyph(8) + ' M-5.5-5 h11 M-5.5 0 h11 M-5.5 5 h11';
  if (kind === 'roller') return 'M-11-11h22v22h-22z M-4 -11 l0 22 M4 -11 l0 22';
  if (kind === 'unit') return polyGlyph(6) + ' M0-14v-5 M-2.5-16.5h5';
  return 'M0-13 L11 0 L0 13 L-11 0 Z M0-6 L5 0 L0 6 L-5 0 Z';
}

function buildShop() {
  var wrap = $('#shop');
  wrap.innerHTML = '';
  SHOP.forEach(function (item) {
    var b = el('button', 'btn');
    b.id = 'btn-' + item.kind;
    b.type = 'button';
    b.innerHTML =
      '<span class="ringwrap">' +
        '<svg viewBox="0 0 48 48"><circle class="ring-bg" cx="24" cy="24" r="21"/>' +
        '<circle class="ring-fg" cx="24" cy="24" r="21" stroke-dasharray="131.95" stroke-dashoffset="131.95"/></svg>' +
        '<svg class="glyph" viewBox="-24 -24 48 48"><path d=""/></svg>' +
      '</span>' +
      '<span class="labels"><span class="name"></span><span class="sub"></span></span>' +
      '<span class="price"></span>';
    /* Commit on RELEASE with a 12 px slide-off cancel, the way Android itself
       behaves. Buying on pointerdown meant a thumb brushing the shop on its way
       to the die bought whatever it touched - and RECAST, irreversible and
       capped at three uses, sits in that stack. */
    /* Holding a repeatable card starts the repeater (see HOLD). The press is
       shared across the whole shop, so a second finger is simply ignored. */
    var outside = function (ev) {
      var r = b.getBoundingClientRect();
      return ev.clientX < r.left || ev.clientX > r.right ||
             ev.clientY < r.top || ev.clientY > r.bottom;
    };
    var mine = function (ev) { return shopPress && shopPress.node === b && shopPress.id === ev.pointerId; };
    var drop = function (ev) {
      if (!mine(ev)) return;
      shopPress = null;
      endHold(true);
      refreshShop();                        // the pinned card may now re-sort
    };
    b.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;          // right or middle button never buys
      ev.preventDefault();
      Audio2.unlock();
      if (shopPress) return;
      shopPress = { id: ev.pointerId, node: b, kind: item.kind, x: ev.clientX, y: ev.clientY,
                    cancelled: false, repeated: false };
      try { b.setPointerCapture(ev.pointerId); } catch (e) {}
      if (!G.panelOpen) beginHold(item.kind, shopPress);
      wake();
    });
    b.addEventListener('pointermove', function (ev) {
      if (!mine(ev)) return;
      var p = shopPress;
      if (G.hold && G.hold.live) {
        /* once it is repeating, only leaving the card stops it: a thumb held
           for two seconds drifts a few pixels and that is not a cancel */
        if (outside(ev)) { p.cancelled = true; endHold(true); }
      } else if (!p.cancelled && Math.hypot(ev.clientX - p.x, ev.clientY - p.y) > HOLD.SLIDE_PX) {
        p.cancelled = true;                 // the 12 px slide-off cancel
        endHold(false);
      }
    });
    b.addEventListener('pointerup', function (ev) {
      if (!mine(ev)) return;
      var p = shopPress;
      shopPress = null;
      endHold(true);
      refreshShop();                        // the pinned card may now re-sort
      if (p.cancelled || p.repeated) return;  // a hold never buys one more on release
      if (Math.hypot(ev.clientX - p.x, ev.clientY - p.y) > HOLD.SLIDE_PX) return;
      if (outside(ev)) return;
      tryBuy(item.kind);
    });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    b.addEventListener('pointercancel', drop);
    b.addEventListener('pointerleave', drop);
    b.addEventListener('lostpointercapture', drop);
    b.hidden = true;
    b.style.order = item.order;
    wrap.appendChild(b);
    shopNodes[item.kind] = {
      root: b,
      ring: b.querySelector('.ring-fg'),
      glyph: b.querySelector('.glyph path'),
      name: b.querySelector('.name'),
      sub: b.querySelector('.sub'),
      price: b.querySelector('.price')
    };
  });
}

/* Everything one card needs, in one pass: whether it is on screen at all,
   whether it is still ghosted, its price and its two lines of type. */
function cardState(kind, targets) {
  var t = targets[kind];
  /* `ring` is progress toward THIS card, -1 meaning "use coins against price".
     A card gated on something other than coins sets it, so the ring still fills
     while the gate is unmet instead of sitting empty for the whole wait. */
  var s = { show: false, locked: !E.unlocked(st, kind), cost: Infinity,
            name: null, sub: '', price: '', ring: -1 };
  var d;
  if (kind === 'side') {
    s.show = t !== null && st.lifetime >= E.K.UNLOCK_SIDE_COINS / 3;
    if (t) {
      s.cost = t.cost;
      s.sub = s.locked ? THEME.strings.lockedSide : THEME.strings.sideSub(t.n);
      s.price = E.fmt(t.cost);
      if (s.locked) s.ring = st.lifetime / E.K.UNLOCK_SIDE_COINS;
    }
  } else if (kind === 'x2') {
    s.show = !!t;
    if (t) {
      d = st.dice[t.unit];
      s.cost = t.cost;
      s.sub = t.gated ? THEME.strings.needsSides(t.needs)
            : (s.locked && st.roller < 0) ? THEME.strings.lockedJackRoller
            : d.x2 > 0 ? THEME.strings.x2Owned(d.x2, d.tier) + ', +1'
            : THEME.strings.x2Sub(d.n - t.k + 1);
      s.price = E.fmt(t.cost);
      if (t.gated) s.ring = d.n / t.needs;
      else if (s.locked && st.roller < 0) s.ring = 0;
    }
  } else if (kind === 'jack') {
    s.show = !!t;
    if (t) {
      s.cost = t.cost;
      s.sub = st.roller < 0 ? THEME.strings.lockedJackRoller
            : t.gated ? THEME.strings.needsSides(t.needs)
            : THEME.strings.jackSub(t.tier, E.jackMult(t.tier));
      s.price = E.fmt(t.cost);
      if (st.roller < 0) s.ring = 0;
      else if (t.gated) s.ring = st.dice[t.unit].n / t.needs;
    }
  } else if (kind === 'tier3') {
    s.show = !!t;
    if (t) { s.cost = t.cost; s.sub = THEME.strings.tier3Sub; s.price = E.fmt(t.cost); }
  } else if (kind === 'roller') {
    /* An owned upgrade never leaves the shop: gating purely on die 1's size made
       ROLLER and + DIE vanish the instant a Recast put every die back to one
       side, taking the only rolls/sec readout in the game with them. The same
       rule keeps the card at max level, reading MAX, the way RECAST does at
       3/3 - that is the moment the player most wants to see what they bought. */
    var rMax = st.roller >= E.K.MAX_ROLLER_LEVEL;
    s.show = rMax || st.roller >= 0 || st.dice[0].n >= E.K.UNLOCK_ROLLER_SIDES - 2;
    s.cost = E.costOf(st, kind);
    s.name = st.roller < 0 ? THEME.strings.roller : THEME.strings.roller + ' Lv' + (st.roller + 1);
    if (rMax) {
      s.sub = THEME.strings.rollerSub(E.autoRate(E.K.MAX_ROLLER_LEVEL));
      s.price = 'MAX';
      s.ring = 1;
      /* costOf is Infinity at max level, and the middle two cards are chosen by
         cheapest cost - so the card the comment above says must stay visible
         sorted dead last and vanished the instant it was maxed, taking the only
         rolls/sec readout with it. A bought-out card sorts first instead. */
      s.cost = -1;
    } else {
      s.sub = s.locked ? THEME.strings.lockedRoller : THEME.strings.rollerSub(E.autoRate(st.roller + 1));
      s.price = E.fmt(s.cost);
      if (s.locked) s.ring = st.dice[0].n / E.K.UNLOCK_ROLLER_SIDES;
    }
  } else if (kind === 'unit') {
    s.show = st.slots < E.K.MAX_DICE &&
             (st.slots > 1 || st.dice[0].n >= E.K.UNLOCK_UNIT_SIDES - 2);
    s.cost = E.costOf(st, kind);
    /* name the gate that is actually still unmet, side count first */
    var needSides = st.dice[0].n < E.K.UNLOCK_UNIT_SIDES;
    s.sub = s.locked ? (needSides ? THEME.strings.lockedUnit
                                  : THEME.strings.lockedUnitRoller)
                     : THEME.strings.unitSub(st.slots + 1);
    s.price = E.fmt(s.cost);
    if (s.locked) {
      s.ring = needSides ? st.dice[0].n / E.K.UNLOCK_UNIT_SIDES
                         : (st.roller + 1) / (E.K.UNLOCK_UNIT_ROLLER + 1);
    }
  } else {
    var threshold = E.recastThreshold(st);
    var capAt = E.shardsMaxedAt(st);
    var done = st.recasts >= E.K.MAX_RECASTS;
    /* rising is false while SHARD_RATIO_CAP is 1: the payout is flat, so there
       is no second bar to fill and nothing to explain. The card reads one fixed
       shard number and one plain ring, and the lit button IS the best button -
       shown by the card having nothing more to offer, not said in a word. */
    var rising = capAt > threshold;
    var maxed = rising && st.runCoins >= capAt;
    s.show = st.runCoins >= threshold * 0.5 || st.recasts > 0;
    s.cost = threshold;
    s.sub = done ? THEME.strings.recastDone
          : s.locked ? 'AT ' + E.fmt(threshold) + ' THIS RUN'
          : '+' + E.shardsFor(st) + ' SHARDS' + (maxed ? ' · MAX' : '');
    s.price = done ? 'RUN ' + st.recasts + '/' + E.K.MAX_RECASTS
            : s.locked ? E.fmt(st.runCoins) + '/' + E.fmt(threshold)
            : (!rising || maxed) ? 'RUN ' + (st.recasts + 1) + '/' + E.K.MAX_RECASTS
            : E.fmt(st.runCoins) + '/' + E.fmt(capAt);
  }
  return s;
}

function refreshShop() {
  var targets = {
    side: E.sideTarget(st), x2: E.x2Target(st),
    jack: E.jackTarget(st), tier3: E.tier3Target(st)
  };
  var states = {}, mids = [], i;
  SHOP.forEach(function (item) { states[item.kind] = cardState(item.kind, targets); });

  /* the middle two: the cheapest of what is on offer, so the shop never grows a
     fifth card and never needs a tab */
  for (i = 0; i < MIDDLE.length; i++) {
    if (states[MIDDLE[i]].show) mids.push(MIDDLE[i]);
  }
  mids.sort(function (a, b) { return states[a].cost - states[b].cost; });
  var keep = {}, kept = 0;
  keep.side = true;
  keep.recast = true;
  /* the card under the finger stays until release, so the shop never swaps
     another card in under the thumb - pinned by the live PRESS, not the
     repeater, because a hold that stops for funds or a retarget ends the
     repeater while the finger is still down */
  var pk = shopPress ? shopPress.kind : G.hold ? G.hold.kind : null;
  if (pk && mids.indexOf(pk) >= 0) { keep[pk] = true; kept = 1; }
  for (i = 0; i < mids.length && kept < 2; i++) {
    if (!keep[mids[i]]) { keep[mids[i]] = true; kept++; }
  }

  SHOP.forEach(function (item) {
    var n = shopNodes[item.kind];
    var s = states[item.kind];
    var visible = s.show && !!keep[item.kind];

    /* A card appearing or disappearing changes #stageWrap's height without
       firing a window resize, so the canvas is re-measured on both transitions
       for browsers with no ResizeObserver. sizeCanvas early-returns otherwise. */
    if (visible && n.root.hidden) {
      n.root.hidden = false;
      n.root.classList.remove('enter');
      void n.root.offsetWidth;            // restart the slide-up
      n.root.classList.add('enter');
      sizeCanvas();
    } else if (!visible) {
      if (!n.root.hidden) { n.root.hidden = true; sizeCanvas(); }
      return;
    }
    if (item.kind === 'x2' || item.kind === 'tier3' || item.kind === 'jack') {
      var t = targets[item.kind];
      setText(n.name, item.name + (t && st.dice.length > 1 ? ' · D' + (t.unit + 1) : ''));
    } else {
      setText(n.name, s.name || item.name);
    }
    setText(n.sub, s.sub);
    setText(n.price, s.price);
    var d = glyphPath(item.kind, targets.side);
    if (n.lastGlyph !== d) { n.lastGlyph = d; n.glyph.setAttribute('d', d); }
    n.root.classList.toggle('locked', s.locked);

    var have = item.kind === 'recast' ? st.runCoins : st.coins;
    var ready = !s.locked && (item.kind === 'recast' ? true : E.gte(st.coins, s.cost));
    n.root.classList.toggle('ready', ready);
    /* A locked card used to show an empty ring for its whole wait. The ring is
       "progress toward this card": coins against price when price is the only
       thing missing, and the gate's own progress when it is not. */
    var p = Math.max(0, Math.min(1, s.ring >= 0 ? s.ring : have / s.cost));
    var off = (131.95 * (1 - p)).toFixed(2);
    if (n.lastRing !== off) { n.lastRing = off; n.ring.setAttribute('stroke-dashoffset', off); }
  });

  var pal = $('#paletteBtn');
  var skinsOpen = st.lifetime >= E.cheapestSkin(st) || E.skinCount(st, 'die') > 1 || E.skinCount(st, 'bg') > 1;
  if (pal.hidden === skinsOpen) pal.hidden = !skinsOpen;
  pal.classList.toggle('armed', skinsOpen && (E.canBuySkin(st, 'die', 1) || E.canBuySkin(st, 'die', 2) ||
                                              E.canBuySkin(st, 'bg', 1) || E.canBuySkin(st, 'bg', 2)));
}

/* ---- skins panel ---------------------------------------------------------
   One screen, one grid, two rows of three. Every swatch is drawn live from the
   same numbers the game draws with, so there is nothing to keep in sync. */

var skinNodes = null;

function drawDieSwatch(ctx, w, h, skin) {
  var sk = skin[mode()];
  var R = Math.min(w, h) * 0.34;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w / 2, h / 2 + R * 0.1);
  ctx.translate(R * 0.04, R * 0.06);
  roundedPolyPath(ctx, polyPoints(6, R, 0), 3);
  ctx.fillStyle = sk.rim; ctx.fill();
  ctx.translate(-R * 0.04, -R * 0.06);
  roundedPolyPath(ctx, polyPoints(6, R, 0), 3);
  var g = ctx.createLinearGradient(-R, -R, R, R);
  g.addColorStop(0, sk.face); g.addColorStop(1, sk.face2);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = sk.rim; ctx.stroke();
  ctx.fillStyle = sk.ink;
  ctx.font = '600 ' + (R * 0.5).toFixed(0) + 'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('6', 0, 0);
  ctx.restore();
}

function drawBgSwatch(ctx, w, h, skin) {
  var sk = skin[mode()];
  ctx.clearRect(0, 0, w, h);
  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, sk.top); g.addColorStop(1, sk.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  var gy = h * 0.74;
  var rg = ctx.createRadialGradient(w / 2, gy, 1, w / 2, gy, w * 0.55);
  rg.addColorStop(0, sk.glow); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.5; ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(w * 0.12, gy); ctx.lineTo(w * 0.88, gy);
  ctx.lineWidth = 1.5; ctx.strokeStyle = sk.line; ctx.stroke();
}

function buildSkins() {
  skinNodes = { die: [], bg: [] };
  [['die', DIE_SKINS, '#dieGrid'], ['bg', BG_SKINS, '#bgGrid']].forEach(function (row) {
    var cat = row[0], list = row[1], grid = $(row[2]);
    grid.innerHTML = '';
    list.forEach(function (skin, idx) {
      var b = el('button', 'swatch');
      b.type = 'button';
      var c = el('canvas');
      c.width = 100; c.height = 52;
      var tag = el('span', 'tag', '');
      b.appendChild(c);
      b.appendChild(tag);
      b.addEventListener('click', function () { onSkin(cat, idx); });
      grid.appendChild(b);
      skinNodes[cat].push({ root: b, canvas: c, tag: tag, skin: skin });
    });
  });
}

function onSkin(cat, idx) {
  if (E.skinOwned(st, cat, idx)) {
    E.equipSkin(st, cat, idx);
    Audio2.play('buy');
  } else if (E.canBuySkin(st, cat, idx)) {
    var sets = E.setsComplete(st);
    E.buySkin(st, cat, idx);
    Audio2.play(E.setsComplete(st) > sets ? 'grow' : 'buy');
    buzz(14);
  } else {
    return;
  }
  applyTheme();
  refreshSkins();
  refreshShop();
  save();
  wake();
}

function refreshSkins() {
  if (!skinNodes) return;
  [['die', '#dieSet'], ['bg', '#bgSet']].forEach(function (row) {
    var cat = row[0], nodes = skinNodes[cat];
    var equipped = cat === 'bg' ? st.equipBg : st.equipDie;
    nodes.forEach(function (n, idx) {
      var owned = E.skinOwned(st, cat, idx);
      var cost = E.skinCost(cat, idx);
      n.root.classList.toggle('owned', owned);
      n.root.classList.toggle('equipped', owned && idx === equipped);
      n.root.classList.toggle('afford', !owned && E.gte(st.coins, cost));
      setText(n.tag, owned ? (idx === equipped ? 'EQUIPPED' : n.skin.name) : E.fmt(cost));
      var ctx = n.canvas.getContext('2d');
      if (cat === 'die') drawDieSwatch(ctx, n.canvas.width, n.canvas.height, n.skin);
      else drawBgSwatch(ctx, n.canvas.width, n.canvas.height, n.skin);
    });
    var have = E.skinCount(st, cat), total = nodes.length;
    var line = $(row[1]);
    var done = have >= total;
    line.classList.toggle('done', done);
    setText(line, done ? '+' + Math.round(E.K.SET_BONUS * 100) + '% INCOME ACTIVE'
                       : have + ' / ' + total + ' · COMPLETE FOR +' +
                         Math.round(E.K.SET_BONUS * 100) + '% INCOME');
  });
}

function openSkins() {
  if (!skinNodes) buildSkins();
  refreshSkins();
  openPanel('#skinsPanel');
}

/* ---- input ---------------------------------------------------------------- */

function onTap(ev) {
  ev.preventDefault();
  Audio2.unlock();
  wake();
  if (!G.hintGone) { G.hintGone = true; $('#hint').classList.add('gone'); }
  if (frozen() || G.panelOpen) return;
  /* wall clock, not the loop clock: the loop sleeps when nothing is animating
     and a sleeping clock would swallow every tap until it woke */
  var wall = performance.now() / 1000;
  if (wall - G.tapGuard < E.K.TAP_COOLDOWN_S) return;
  G.tapGuard = wall;
  doRoll(!G.fastMode);
  markDirty();
  wake();
}

/* ---- loop ----------------------------------------------------------------- */

function wake() {
  if (!G.raf) { G.last = performance.now(); G.raf = requestAnimationFrame(frame); }
}

function busy() {
  if (st.roller >= 0) return true;
  if (G.floats.length || G.particles.length || anyMorph() || G.hold || G.shake > 0) return true;
  if (G.maxRollTick > 0 || G.pendingLand || G.burst || G.sparkle > 0 || G.merge) return true;
  if (Math.abs(G.shownCoins - st.coins) > 0.5) return true;
  var i;
  for (i = 0; i < G.anims.length; i++) {
    if (G.anims[i].t < 1 || G.anims[i].flash > 0 || G.anims[i].glow > 0) return true;
  }
  return false;
}

function frame(now) {
  var dt = Math.min(0.1, (now - G.last) / 1000);
  G.last = now;
  G.now = clock();
  update(dt);
  draw();
  G.raf = busy() ? requestAnimationFrame(frame) : 0;
}

function update(dt) {
  var i, j;

  /* The repeater runs first, so a purchase made this frame is drawn this frame. */
  holdStep();

  if (G.floatBudget > 0) {
    G.floatBudget = Math.max(0, G.floatBudget - dt);
    if (G.floatBudget === 0) flushMerged();
  }

  var rate = E.throwRate(st, 0);
  G.fastMode = rate > E.K.FAST_ROLL_THRESHOLD;
  if (G.fastMode) G.spinPhase += dt * Math.min(26, 2.2 + rate * 0.9);

  /* Auto-roll on accumulated time, never on frames. The morph freeze and an open
     panel are UI freezes, not income freezes: the coins still land, only the
     tween, the float and the blip are held back. */
  if (st.roller >= 0) {
    G.autoAcc += dt * E.autoRate(st.roller);
    var n = Math.floor(G.autoAcc);
    if (n > 0) {
      G.autoAcc -= n;
      if (n > 240) n = 240;                         // a long stall never floods
      var last = null, feed = null, fj;
      for (i = 0; i < n; i++) {
        last = E.roll(st, Math.random, Date.now());
        /* Every roll the frame resolved has to reach the float feed, or the coin
           counter climbs faster than the numbers account for. At 30 fps roller
           L11 resolves two a frame and six after a 100 ms hiccup; only the last
           one used to be shown and the rest were dropped before payFeedback -
           which is the only thing that merges them - ever saw them. */
        if (!feed) feed = { paid: last.paid.slice(), types: last.types.slice(), total: last.total };
        else {
          feed.total += last.total;
          for (fj = 0; fj < last.paid.length; fj++) {
            feed.paid[fj] = (feed.paid[fj] || 0) + last.paid[fj];
            feed.types[fj] = bestType(feed.types[fj], last.types[fj]);
          }
        }
      }
      if (last && n > 1) last.feed = feed;
      var quiet = frozen() || G.panelOpen;
      if (quiet && last && !G.panelOpen) {
        /* the + SIDE freeze holds the float back, never drops it: merged and
           shown the moment the freeze ends */
        if (!G.merge) G.merge = { paid: [], types: [], total: 0 };
        for (fj = 0; fj < feed.paid.length; fj++) {
          G.merge.paid[fj] = (G.merge.paid[fj] || 0) + feed.paid[fj];
          G.merge.total += feed.paid[fj];
          G.merge.types[fj] = bestType(G.merge.types[fj], feed.types[fj]);
        }
        G.floatBudget = Math.max(G.floatBudget, G.freezeUntil - clock(), 0.01);
      }
      if (!quiet && last) {
        flushLand();                                // never drop an unpaid throw
        G.lastResult = last;
        for (j = 0; j < st.dice.length; j++) {
          var an = unitAnim(j);
          an.index = last.indices[j];
          if (G.fastMode) { an.t = 1; }
          else {
            var target = rotationFor(st.dice[j].n, last.indices[j]);
            var delta = target - (an.rot % (2 * Math.PI));
            while (delta <= 0) delta += 2 * Math.PI;
            an.from = an.rot; an.to = an.rot + delta + 4 * Math.PI; an.t = 0; an.dur = 0.38;
          }
        }
        if (G.fastMode) landResult(last);
        else G.pendingLand = last;
      }
      markDirty();
    }
  }

  /* Fast roll never stops the polygon: it spins continuously and strobes a
     legible number into the marker eight times a second. */
  if (G.fastMode) {
    G.snapAcc += dt;
    if (G.snapAcc >= 0.125) {
      G.snapAcc = 0;
      for (i = 0; i < st.dice.length; i++) {
        var a2 = unitAnim(i);
        a2.snap = 0.06;
        a2.snapRot = rotationFor(st.dice[i].n, a2.index);
      }
    }
    for (i = 0; i < G.anims.length; i++) {
      if (G.anims[i].snap > 0) G.anims[i].snap = Math.max(0, G.anims[i].snap - dt);
    }
  } else {
    G.snapAcc = 0;
    for (i = 0; i < G.anims.length; i++) G.anims[i].snap = 0;
  }

  /* per-die settle: easeOutQuart plus a short overshoot at the end */
  for (i = 0; i < G.anims.length; i++) {
    var a = G.anims[i];
    if (a.t < 1) {
      a.t = Math.min(1, a.t + dt / a.dur);
      a.rot = a.from + (a.to - a.from) * rollEase(a.t);
      if (a.t >= 1 && i === 0) flushLand();
    }
    if (a.flash > 0) a.flash = Math.max(0, a.flash - dt);
    if (a.glow > 0) a.glow = Math.max(0, a.glow - dt);
  }

  /* A chained step parks at t=1 while its hold is still live, so the die sits
     on its newest shape with the numerals held back; endHold() turns it into
     the settle. Everything else ends when it lands. */
  for (i = 0; i < G.morphs.length; i++) {
    var mo = G.morphs[i];
    if (!mo) continue;
    mo.t = Math.min(1, mo.t + dt / mo.dur);
    if (mo.t >= 1 && !(mo.hold && G.hold)) G.morphs[i] = null;
  }
  if (G.burst) {
    G.burst.t += dt / 0.5;
    if (G.burst.t >= 1) G.burst = null;
  }
  if (G.sparkle > 0) G.sparkle = Math.max(0, G.sparkle - dt);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  /* driven every frame, so a Recast, a completed skin set and a Hot Hand all
     move the readout the instant they change what a roll can pay */
  var mrNow = maxRollNow();
  if (mrNow !== G.maxRollTarget) { G.maxRollTarget = mrNow; G.maxRollTick = 0.7; }
  if (G.maxRollTick > 0) {
    G.maxRollTick = Math.max(0, G.maxRollTick - dt);
    var k = 1 - G.maxRollTick / 0.7;
    G.maxRollShown = Math.round(G.maxRollShown + (G.maxRollTarget - G.maxRollShown) * Math.min(1, k * 0.35 + dt * 4));
    if (G.maxRollTick === 0) G.maxRollShown = G.maxRollTarget;
  }

  for (i = G.floats.length - 1; i >= 0; i--) {
    G.floats[i].t += dt / 0.7;
    if (G.floats[i].t >= 1) G.floats.splice(i, 1);
  }
  for (i = G.particles.length - 1; i >= 0; i--) {
    var p = G.particles[i];
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    if (p.t >= p.life) G.particles.splice(i, 1);
  }

  /* The coin counter lerps rather than snapping, but never stays visibly behind:
     once the display is within 0.01% of the real balance - finer than fmt() can
     show - it locks on instead of crawling for seconds after a flurry. */
  var diff = st.coins - G.shownCoins;
  G.shownCoins += diff * Math.min(1, dt / 0.12);
  if (Math.abs(st.coins - G.shownCoins) < Math.max(0.5, st.coins * 1e-4)) G.shownCoins = st.coins;

  setText($('#coins'), E.fmt(G.shownCoins));
  setText($('#maxrollN'), E.fmt(G.maxRollShown));

  refreshHot();
  refreshShop();
}

/* The chip says what it does BEFORE it is used, counts down while it runs, and
   the dice carry the badge so the buff is never a number the player has to
   remember. */
function refreshHot() {
  var chip = $('#hotChip');
  var s = hotState();
  chip.classList.toggle('show', s !== 'hidden');
  chip.classList.toggle('armed', s === 'ready');
  chip.classList.toggle('live', s === 'live');
  chip.classList.toggle('cooling', s === 'cooling');
  if (s === 'cooling') chip.setAttribute('aria-disabled', 'true');
  else chip.removeAttribute('aria-disabled');
  if (s === 'live') {
    var left = hotLeftMs() / 1000;
    /* the name and the effect stay paired: dropping "HOT HAND" the moment it
       fired meant nothing on screen ever connected the chip to the ×3 badge */
    setText($('#hotText'), THEME.strings.hot + ' ×' + E.K.HOT_MULT + ' · ' + Math.ceil(left) + 's');
    var frac = Math.max(0, Math.min(1, left / E.K.HOT_DURATION_S));
    $('#hotRing').setAttribute('stroke-dashoffset', (33.93 * (1 - frac)).toFixed(2));
  } else if (s === 'cooling') {
    /* no "×3" while cooling: next to a timer it read as a buff still running */
    setText($('#hotText'), THEME.strings.hot + ' ↻ ' +
                           E.fmtTime((st.hotReadyAt - Date.now()) / 1000));
  } else {
    setText($('#hotText'), THEME.strings.hotOffer(E.K.HOT_MULT, E.K.HOT_DURATION_S));
  }
}

/* ---- draw ----------------------------------------------------------------- */

function draw() {
  var P = THEME.palette;
  var bg = bgSkin()[mode()];
  cx.clearRect(0, 0, CW, CH);

  var sx = 0, sy = 0;
  if (G.shake > 0) {
    var k = G.shake / 0.22 * 6;
    sx = (Math.random() - 0.5) * k;
    sy = (Math.random() - 0.5) * k;
  }
  cx.save();
  cx.translate(sx, sy);

  var gy = groundY();

  /* the equipped background's horizon glow; the page itself carries the gradient */
  var rg = cx.createRadialGradient(CW / 2, gy, 4, CW / 2, gy, CW * 0.72);
  rg.addColorStop(0, bg.glow);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  cx.save();
  cx.globalAlpha = 0.34;
  cx.fillStyle = rg;
  cx.fillRect(0, 0, CW, CH);
  cx.restore();

  cx.beginPath();
  cx.moveTo(CW * 0.06, gy);
  cx.lineTo(CW * 0.94, gy);
  cx.lineWidth = 1.5;
  cx.strokeStyle = P.ground;
  cx.stroke();

  var count = st.dice.length;
  var scale = fitScale(st.dice);
  /* with one die there is nothing to disambiguate, so no pulse */
  var sideTgt = count > 1 ? E.sideTarget(st) : null;
  var i;

  for (i = 0; i < count; i++) {
    var die = st.dice[i];
    var sides = die.n;
    var R = radiusFor(sides, count) * scale;
    var an = unitAnim(i);
    var x = unitX(i, count);
    var rot = an.rot;
    var labels = true;

    if (G.fastMode) {
      if (an.snap > 0) { rot = an.snapRot; labels = true; }
      else { rot = G.spinPhase + i * 0.7; labels = false; }
    }

    var depth = bottomOf(sides, R, rot);
    var morphPts = null;
    var mo = G.morphs[i] || null;

    /* The morph is drawn at the die's CURRENT rotation, so a die keeps rolling
       (or spinning, in fast mode) while it grows, and its contact depth is
       read off the outline actually being drawn - it rides the ground line
       through every intermediate shape. */
    if (mo) {
      var cur = morphNow(mo);
      var mc = Math.cos(rot), ms = Math.sin(rot), low = -Infinity, ux, uy, py2;
      morphPts = new Array(cur.length);
      for (var q = 0; q < cur.length; q++) {
        ux = cur[q][0] * scale; uy = cur[q][1] * scale;
        py2 = ux * ms + uy * mc;
        morphPts[q] = [ux * mc - uy * ms, py2];
        if (py2 > low) low = py2;
      }
      depth = low;
    }
    var mt = mo ? Math.min(1, mo.t) : 1;
    var fadeIn = mo ? Math.max(0, (mt - 0.55) / 0.45) : 1;

    var y = gy - depth;
    var g = dieGeom(i);
    g.x = x; g.y = y; g.R = R; g.top = y - R;

    /* soft contact shadow */
    cx.save();
    cx.globalAlpha = 0.3;
    cx.fillStyle = P.line;
    cx.beginPath();
    cx.ellipse(x, gy + 4, R * 0.72, 5, 0, 0, Math.PI * 2);
    cx.fill();
    cx.restore();

    var squash = 1, squashY = 1;
    if (an.t < 1) {
      var qz = an.t;
      var s = qz < 0.35 ? 1 - 0.12 * (qz / 0.35)
            : qz < 0.7 ? 0.88 + 0.18 * ((qz - 0.35) / 0.35)
            : 1.06 - 0.06 * ((qz - 0.7) / 0.3);
      squashY = s;
      squash = 1 + (1 - s) * 0.5;
    }

    var opts = {
      die: die, sides: sides, R: R, rot: rot, x: x, y: y,
      sx: squash, sy: squashY,
      landed: an.index, flash: an.flash, glow: an.glow,
      pulse: !!sideTgt && sideTgt.unit === i && !anyMorph(),
      time: G.now,
      labels: labels,
      /* numerals stamp when the shape settles: a chained step keeps them out,
         the settle fades them in and pops the new top face 1.6x -> 1.0 */
      labelAlpha: mo ? (mo.quiet ? 0 : fadeIn) : 1,
      stampFace: mo ? mo.newFace : -1,
      stampScale: mo ? (mo.quiet ? 1 + 0.14 * (1 - mt)
                               : mo.fromHold ? 1.25 - 0.25 * fadeIn : 1.6 - 0.6 * fadeIn) : 1,
      quiet: !!(mo && mo.quiet),
      fromHold: !!(mo && mo.fromHold),
      morphPts: morphPts,
      spin: 0,
      ghost: false
    };

    /* motion ghosts: three while settling, a symmetric blur while spinning -
       and a growing die keeps them, because it keeps rolling */
    if (an.t < 1 && !G.fastMode) {
      for (var gI = 1; gI <= 3; gI++) {
        cx.save();
        cx.globalAlpha = 0.09;
        drawDie(cx, i, Object.assign({}, opts, { spin: -gI * 0.09, ghost: true }));
        cx.restore();
      }
    }
    if (G.fastMode) {
      cx.save();
      cx.globalAlpha = 0.13;
      drawDie(cx, i, Object.assign({}, opts, { spin: 0.16, ghost: true }));
      drawDie(cx, i, Object.assign({}, opts, { spin: -0.16, ghost: true }));
      cx.restore();
    }

    THEME.drawFace(cx, i, opts);

    /* the fixed marker every landed face rotates under */
    var my = y - R - 5;
    cx.beginPath();
    cx.moveTo(x - 6, my - 9);
    cx.lineTo(x + 6, my - 9);
    cx.lineTo(x, my);
    cx.closePath();
    cx.fillStyle = an.flash > 0 ? P.fg : P.accent;
    cx.fill();

    /* the expanding ring belongs to the money shot only: a tap, or the one
       settle that ends a hold - never to each chained step */
    if (mo && !mo.quiet && mo.t < 1) {
      cx.save();
      cx.globalAlpha = 1 - mo.t;
      cx.beginPath();
      cx.arc(x, y, R * (0.9 + mo.t * 0.9), 0, Math.PI * 2);
      cx.lineWidth = 3;
      cx.strokeStyle = P.gold;
      cx.stroke();
      cx.restore();
    }
  }

  /* landing dust */
  for (i = 0; i < G.particles.length; i++) {
    var pt = G.particles[i];
    cx.save();
    cx.globalAlpha = Math.max(0, 1 - pt.t / pt.life) * 0.8;
    cx.fillStyle = pt.color;
    cx.beginPath();
    cx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    cx.fill();
    cx.restore();
  }

  /* jackpot coin sparkle, screen space */
  if (G.sparkle > 0) {
    var sp = G.sparkle / 0.9;
    cx.save();
    cx.globalAlpha = sp * 0.85;
    cx.fillStyle = P.gold;
    for (i = 0; i < 16; i++) {
      var ang = (i / 16) * Math.PI * 2 + (1 - sp) * 1.4;
      var rad = CW * (0.1 + (1 - sp) * 0.42);
      var px = CW / 2 + Math.cos(ang) * rad;
      var py = CH * 0.46 + Math.sin(ang) * rad * 0.62;
      var rr = 2.4 * sp + 0.6;
      cx.beginPath();
      cx.moveTo(px, py - rr * 2.2); cx.lineTo(px + rr, py);
      cx.lineTo(px, py + rr * 2.2); cx.lineTo(px - rr, py);
      cx.closePath();
      cx.fill();
    }
    cx.restore();
  }

  /* DOUBLES / TRIPLES: one tag between the dice that matched, then the floats */
  if (G.burst) {
    var b = G.burst;
    var bt = b.t;
    cx.save();
    cx.globalAlpha = bt < 0.2 ? bt / 0.2 : 1 - Math.pow((bt - 0.2) / 0.8, 2);
    var bs = 1 + (bt < 0.25 ? (0.25 - bt) * 1.6 : 0);
    cx.translate(b.x, b.y);
    cx.scale(bs, bs);
    cx.font = '700 18px ui-monospace, Menlo, Consolas, monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    var wtxt = cx.measureText(b.text).width;
    roundRect(cx, -wtxt / 2 - 10, -14, wtxt + 20, 28, 8);
    cx.fillStyle = P.gold;
    cx.fill();
    cx.fillStyle = bg.top;
    cx.fillText(b.text, 0, 1);
    cx.restore();
  }

  /* the Hot Hand badge sits with the dice, not in a menu */
  if (hotActive()) {
    cx.save();
    cx.font = '700 15px ui-monospace, Menlo, Consolas, monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    var ht = '×' + E.K.HOT_MULT;
    var hw = cx.measureText(ht).width;
    var pulse = 0.85 + 0.15 * Math.sin(G.now * 6);
    cx.globalAlpha = pulse;
    roundRect(cx, CW / 2 - hw / 2 - 9, 6, hw + 18, 24, 7);
    cx.fillStyle = P.hot;
    cx.fill();
    cx.fillStyle = bg.top;
    cx.fillText(ht, CW / 2, 18);
    cx.restore();
  }

  var rise = floatRise();
  for (i = 0; i < G.floats.length; i++) {
    var f = G.floats[i];
    if (f.t < 0) continue;
    cx.save();
    cx.globalAlpha = f.t < 0.15 ? f.t / 0.15 : 1 - Math.pow(f.t, 3);
    cx.fillStyle = f.color;
    cx.font = '600 ' + f.size + 'px ui-monospace, Menlo, Consolas, monospace';
    cx.textAlign = 'center';
    /* fitScale reserves the headroom, but a very short stage can still run out;
       clamping the travel keeps the number on the canvas either way */
    cx.fillText(f.text, f.x, f.y - Math.min(rise, Math.max(8, f.y - 10)) * f.t);
    cx.restore();
  }

  cx.restore();
}

/* ---- settings ------------------------------------------------------------- */

function setMuteUI() {
  var on = !st.muted;
  $('#slash').style.display = on ? 'none' : '';
  $('#wave1').style.display = on ? '' : 'none';
  $('#wave2').style.display = on ? '' : 'none';
  $('#setMute').textContent = 'SOUND: ' + (on ? 'ON' : 'OFF');
}

function toggleMute() {
  st.muted = !st.muted;
  setMuteUI();
  save();
}

function hardReset() {
  Store.remove(E.K.SAVE_KEY);
  Store.remove(E.K.SAVE_KEY_V1);
  Store.remove(E.K.SAVE_KEY_BROKEN);
  var theme = st.theme;
  st = E.newState();
  st.theme = theme;
  resetVisualState();
  G.shownCoins = 0; G.maxRollShown = 1; G.maxRollTarget = 1;
  G.hintGone = false;
  $('#hint').classList.remove('gone');
  closePanel('#settingsPanel');
  closePanel('#offlinePanel');        // the pending claim went with the save
  closePanel('#skinsPanel');
  setMuteUI();
  applyTheme();
  refreshSkins();
  refreshShop();
  save();
  wake();
}

/* ---- dev tools (only with ?dev=1) ----------------------------------------- */

function buildDev() {
  if (!DEV) return;
  globalThis.OMS = { get state() { return st; }, loop: G, econ: E };
  var box = $('#dev');
  box.classList.add('show');
  $('#app').classList.add('devon');
  function grant(amount) {
    st.coins = E.add(st.coins, amount);
    st.runCoins = E.add(st.runCoins, amount);
    st.lifetime = E.add(st.lifetime, amount);
  }
  [
    ['+1K', function () { grant(1000); }],
    ['+1M', function () { grant(1e6); }],
    ['+1B', function () { grant(1e9); }],
    ['+10 MIN', function () {
      grant(st.roller >= 0 ? E.offlineEarnings(st, 600, false) : E.income(st, 1.7, 0) * 600);
    }],
    ['+20 SIDES', function () {
      var i, t;
      for (i = 0; i < 20; i++) { t = E.sideTarget(st); if (!t) break; st.dice[t.unit].n += 1; }
      G.maxRollTarget = G.maxRollShown = maxRollNow();
    }],
    ['+DIE', function () {
      if (st.slots >= E.K.MAX_DICE) return;
      st.dice.push(E.newDie()); st.slots = st.dice.length;
      for (var mi = 0; mi < G.morphs.length; mi++) G.morphs[mi] = null;
      seedGeom();
      G.maxRollTarget = G.maxRollShown = maxRollNow();
    }],
    ['OFFLINE 2H', function () { handleReturn(7200); }],
    /* Seeds a v1 save and reloads, so the migration path can actually be
       exercised on a device that has never had a v1 save on it. */
    ['SEED V1', function () {
      Store.set(E.K.SAVE_KEY_V1, JSON.stringify({
        v: 1, units: [14, 8], coins: 12345, runCoins: 12345, lifetime: 20000,
        roller: 3, shards: 5, recasts: 1, throws: 400, muted: false,
        adsUnlocked: true, savedAt: Date.now() - 3600000
      }));
      setTimeout(function () { Store.remove(E.K.SAVE_KEY); location.reload(); }, 0);
    }],
    ['AD FAIL', function () { Ads.forceFail = !Ads.forceFail; }],
    ['WIPE', hardReset]
  ].forEach(function (pair) {
    var b = el('button', '', pair[0]);
    /* every dev grant is persisted, or the next reload silently undoes it */
    b.addEventListener('click', function () { pair[1](); save(); refreshShop(); wake(); });
    box.appendChild(b);
  });
}

/* ---- boot ----------------------------------------------------------------- */

/* Boot is async only because the durable store is: Capacitor Preferences hands
   the save back through a promise, and reading localStorage first would start a
   brand-new game whenever Android had cleared the WebView's copy. */
function boot() {
  loadAsync().then(start, function () { start(0); });
}

function start(away) {
  G.shownCoins = st.coins;
  G.maxRollTarget = G.maxRollShown = maxRollNow();
  if (st.lifetime > 0) { G.hintGone = true; $('#hint').classList.add('gone'); }

  applyTheme();
  buildShop();
  buildSkins();
  buildDev();
  setMuteUI();
  sizeCanvas();
  refreshSkins();
  refreshShop();

  /* The welcome-back card opens first so a resumed OFFLINE DOUBLE lands on the
     card the player is actually looking at, with the away time already known. */
  handleReturn(away);
  resumePendingReward();
  if (migrated) notice('Save carried over. Every die now reads 1 to N, and faces are bought instead.');
  else if (saveBroken) {
    notice(st.lifetime > 0
      ? 'The newest save could not be read, so an older one was loaded. The damaged copy was kept, not deleted.'
      : 'Your saved game could not be read. It has been set aside rather than overwritten, and this run starts fresh.');
  }

  cv.addEventListener('pointerdown', onTap, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  $('#muteBtn').addEventListener('click', toggleMute);
  $('#themeBtn').addEventListener('click', toggleTheme);
  $('#paletteBtn').addEventListener('click', openSkins);
  $('#skinsClose').addEventListener('click', function () { closePanel('#skinsPanel'); });
  $('#gearBtn').addEventListener('click', function () { openPanel('#settingsPanel'); });
  $('#setClose').addEventListener('click', function () { closePanel('#settingsPanel'); });
  $('#setMute').addEventListener('click', toggleMute);
  $('#setTheme').addEventListener('click', toggleTheme);
  $('#hotChip').addEventListener('click', onHotChip);
  $('#offCollect').addEventListener('click', collectOffline);
  $('#offDouble').addEventListener('click', onOfflineDouble);
  $('#recastNo').addEventListener('click', function () { closePanel('#recastPanel'); });
  $('#recastYes').addEventListener('click', doRecast);

  var resetBtn = $('#setReset');
  var holdStart = 0, holdTimer = 0;
  /* Idempotent, and the pointer is captured. A two-finger press on a full-width
     control ran holdBegin twice and leaked the first interval, which then kept
     calling hardReset every 100 ms with no pointerup target left. */
  function holdBegin(ev) {
    ev.preventDefault();
    if (holdTimer) return;
    try { resetBtn.setPointerCapture(ev.pointerId); } catch (e) {}
    holdStart = Date.now();
    resetBtn.textContent = 'KEEP HOLDING…';
    holdTimer = setInterval(function () {
      var held = (Date.now() - holdStart) / 1000;
      if (held >= 2) { holdEnd(); setTimeout(hardReset, 0); }
      else resetBtn.textContent = 'KEEP HOLDING… ' + (2 - held).toFixed(1);
    }, 100);
  }
  function holdEnd() {
    if (holdTimer) { clearInterval(holdTimer); holdTimer = 0; }
    resetBtn.textContent = 'HOLD TO ERASE EVERYTHING';
  }
  resetBtn.addEventListener('pointerdown', holdBegin);
  resetBtn.addEventListener('pointerup', holdEnd);
  resetBtn.addEventListener('pointerleave', holdEnd);
  resetBtn.addEventListener('pointercancel', holdEnd);

  /* Window resize does not fire when a shop card slides in and takes 64 px off
     the stage, which is the case that actually matters on a phone. */
  if (globalThis.ResizeObserver) {
    try { new ResizeObserver(sizeCanvas).observe($('#stageWrap')); } catch (e) {}
  }
  addEventListener('resize', sizeCanvas);
  addEventListener('orientationchange', sizeCanvas);
  addEventListener('visibilitychange', function () {
    if (document.hidden) {
      shopPress = null;                 // a backgrounded hold never resumes buying
      endHold(true);
      save();
      hiddenPerf = performance.now();
      if (G.raf) { cancelAnimationFrame(G.raf); G.raf = 0; }
    } else {
      var back = st.savedAt ? (Date.now() - st.savedAt) / 1000 : 0;
      /* The wall clock is trusted only as far as the monotonic clock agrees:
         winding the device forward four hours, backgrounding and returning used
         to pay a full offline cap, repeatable for as long as the player kept
         doing it. Across a real app restart there is no monotonic reference
         left, which is the limit of what a client can check on its own. */
      if (hiddenPerf > 0) {
        back = Math.min(back, (performance.now() - hiddenPerf) / 1000 + 5);
        hiddenPerf = 0;
      }
      handleReturn(back);
      wake();
    }
  });
  addEventListener('pagehide', save);

  wake();
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
