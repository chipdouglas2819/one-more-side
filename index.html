<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#14161a">
<title>ONE MORE SIDE</title>
<script>
/* PAINT HINT, not state. The save is the source of truth for the theme, but it
   arrives through a promise - a real IPC round trip to Preferences under
   Capacitor - so a light-mode player saw a full dark page and a dark status bar
   until it resolved, then a 240 ms transition into light on every single
   launch. This runs before first paint from a plain synchronous key that the
   toggle writes alongside the real save. If it is missing or unreadable,
   nothing happens and the document's own dark default stands. */
(function () {
  try {
    var t = localStorage.getItem('oms.theme');
    if (t !== 'light' && t !== 'dark') return;
    document.documentElement.setAttribute('data-theme', t);
    var c = localStorage.getItem('oms.themeColor');
    if (!/^#[0-9a-f]{6}$/i.test(c || '')) return;
    var m = document.getElementById('themeColor');
    if (m) m.setAttribute('content', c);
    document.documentElement.style.background = c;
  } catch (e) {}
})();
</script>
<style>
/* ===========================================================================
   TOKENS. One set of names, two values each. Nothing below this block names a
   raw colour, so light mode is a real design and not a filter over the dark one.
   ========================================================================= */
:root{
  --bg:#14161a;
  --surface:#1d2026;
  --surface2:#262a32;
  --line:#2f343d;
  --fg:#ece7dc;
  --dim:#949aa3;
  --accent:#f0a830;
  --gold:#ffcf5c;
  --tint:#57d6e0;
  --hot:#ff8a3d;
  --danger:#e08a8a;
  --danger-line:#8a4a4a;
  --shadow:rgba(0,0,0,.55);
  --scrim:rgba(10,11,14,.86);
  --ring-bg:#2f343d;
}
:root[data-theme="light"]{
  --bg:#f2eee3;
  --surface:#fffdf6;
  --surface2:#f6f1e4;
  --line:#ddd5c3;
  --fg:#22252a;
  --dim:#6d7078;
  --accent:#b86a12;
  --gold:#a8791a;
  --tint:#1c7f8c;
  --hot:#d8551a;
  --danger:#a8433f;
  --danger-line:#c89a98;
  --shadow:rgba(60,50,30,.22);
  --scrim:rgba(240,236,226,.9);
  --ring-bg:#e2dac8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
  transition:background 240ms linear,color 240ms linear;
}
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  max-width:460px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---- 0-52px: coin counter and the three corner controls ---- */
#hud{position:relative;flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:center}
/* The corner controls are absolute, so the counter has to be told how much of
   the bar is actually its own: two 44px targets a side. Without the max-width a
   six-figure balance ran straight under the palette chip. */
#coins{font-size:26px;letter-spacing:.5px;font-weight:600;color:var(--fg);
  max-width:calc(100% - 184px);overflow:hidden;white-space:nowrap}
.corner{
  position:absolute;top:4px;width:44px;height:44px;border:0;background:none;
  color:var(--dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:10px;
}
.corner:active{background:var(--surface)}
.corner[hidden]{display:none}
#themeBtn{left:2px}
#paletteBtn{left:46px}
#muteBtn{right:2px}
#gearBtn{right:46px}
#paletteBtn.armed{color:var(--gold)}
.corner svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- 52-112px: readout and the Hot Hand chip ---- */
#readout{flex:0 0 auto;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#maxroll{font-size:12px;letter-spacing:3px;color:var(--dim)}
#maxroll b{color:var(--accent);font-weight:600}
#chips{display:flex;gap:6px;align-items:center;min-height:24px}
/* 10px in --dim was unreadable on a phone in daylight, which made the one thing
   that announces a x3 buff invisible while it was running */
.chip{
  position:relative;display:none;align-items:center;gap:6px;height:26px;padding:0 13px;
  border:1px solid var(--line);border-radius:13px;font-weight:600;
  font-size:11px;letter-spacing:1.4px;color:var(--dim);background:var(--surface);
  cursor:pointer;
}
.chip::before{content:"";position:absolute;left:-6px;right:-6px;top:-10px;bottom:-10px}
.chip.show{display:flex}
.chip.armed{border-color:var(--accent);color:var(--accent)}
.chip.live{border-color:var(--gold);color:var(--gold)}
.chip.cooling{pointer-events:none;opacity:.55}
.chip svg{width:14px;height:14px;flex:0 0 14px;display:none}
.chip.live svg{display:block}
.chip .ring-bg2{fill:none;stroke:var(--line);stroke-width:2.6}
.chip .ring-fg2{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:7px 7px}

/* ---- canvas ---- */
#stageWrap{flex:1 1 auto;position:relative;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* Below the ground line, not on it: at 12% the finger sat behind the die it
   is pointing at, which is the first thing a new player ever sees. */
#hint{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);pointer-events:none;
  opacity:.75;animation:hintpulse 1.6s ease-in-out infinite}
#hint svg{width:34px;height:34px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes hintpulse{0%,100%{transform:translateX(-50%) translateY(0);opacity:.3}50%{transform:translateX(-50%) translateY(-7px);opacity:.9}}
#hint.gone{display:none}

/* ---- shop: at most four cards, + SIDE pinned top, RECAST pinned bottom ---- */
#shop{flex:0 0 auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px}
#app.devon #shop{padding-bottom:78px}
.btn{
  position:relative;display:flex;align-items:center;gap:12px;
  width:100%;height:64px;padding:0 14px 0 8px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  color:var(--fg);font:inherit;text-align:left;cursor:pointer;
  transition:border-color 120ms,background 120ms,transform 60ms;
}
.btn[hidden]{display:none}
.btn.enter{animation:slideup 320ms cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideup{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
.btn.ready{border-color:var(--accent)}
.btn.ready .price{color:var(--accent)}
.btn:active{transform:scale(.985)}
.btn.locked{opacity:.52}
/* a held shop card must never be taken over by browser panning or a long-press
   callout: on Android either one fires pointercancel and ends the hold */
#shop .btn{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ringwrap{position:relative;flex:0 0 48px;width:48px;height:48px}
.ringwrap svg{position:absolute;inset:0;width:48px;height:48px}
/* Four cards at 64px plus the gaps and the padding is 298px, against the 270px
   the spec reserves for the shop. On the spec's own 360x740 that costs the
   canvas 28px; on a 360x640 it leaves 230px and fitScale resolves a 100-side
   die to an 8.8px edge with a 15px value window. 64px is also the smallest
   comfortable thumb target, so it is kept wherever there is room and given back
   only on short viewports, where a slightly smaller card beats a die too small
   to read. */
@media (max-height:700px){
  #shop{gap:6px;padding:4px 12px 8px}
  .btn{height:58px}
  .ringwrap{flex:0 0 42px;width:42px;height:42px}
  .ringwrap svg{width:42px;height:42px}
}
.ring-bg{fill:none;stroke:var(--ring-bg);stroke-width:3}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:24px 24px;transition:stroke-dashoffset 140ms linear}
.glyph{stroke:var(--fg);stroke-width:1.6;fill:none;stroke-linejoin:round}
.btn.locked .glyph{stroke:var(--dim);stroke-dasharray:3 3;opacity:.75}
.btn.ready .glyph{stroke:var(--gold)}
.labels{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
/* nowrap without an overflow rule painted "JACKPOT SIDE · D2" straight over the
   price at 360px, so the name truncates exactly the way .sub already does */
.name{font-size:15px;letter-spacing:2.4px;font-weight:600;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;letter-spacing:1px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:15px;letter-spacing:.5px;color:var(--dim);flex:0 0 auto}
#btn-recast{border-color:var(--line)}
#btn-recast.ready{border-color:var(--gold)}
/* Hold-to-buy. The card stays pressed and its ring sweeps round for as long as
   the repeater is buying, so the finger can feel the difference between a tap
   and a hold without a word on screen. */
.btn.holding{transform:scale(.985);background:var(--surface2);border-color:var(--gold)}
.btn.holding .ring-fg{stroke:var(--gold);animation:ringsweep 700ms linear infinite}
@keyframes ringsweep{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}

/* ---- panels ---- */
.panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:20px;background:var(--scrim);backdrop-filter:blur(3px)}
.panel.show{display:flex}
.card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:14px;letter-spacing:3px;color:var(--dim);font-weight:600;text-align:center}
.card .big{font-size:30px;text-align:center;color:var(--gold)}
.card p{font-size:12px;line-height:1.6;color:var(--dim);letter-spacing:.4px}
.card .keep{font-size:12px;line-height:1.7;letter-spacing:.4px}
.card .keep b{color:var(--fg)}
.cta{height:54px;border-radius:12px;border:1px solid var(--accent);background:transparent;
  color:var(--accent);font:inherit;font-size:14px;letter-spacing:3px;cursor:pointer}
.cta:active{transform:scale(.985)}
.cta.ghost{border-color:var(--line);color:var(--dim);height:46px;font-size:12px}
.cta.danger{border-color:var(--danger-line);color:var(--danger)}
.row{display:flex;gap:8px}
.row .cta{flex:1}

/* ---- recast: numbers and icons, no paragraphs ---- */
#recastCard{gap:12px}
#recastCard .row .cta{height:50px}
.rc-run{font-size:10px;letter-spacing:2.4px;color:var(--dim);text-align:center;margin-top:-6px}
.rc-hero{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--gold);font-size:32px;font-weight:600}
.rc-hero .from,.rc-hero .arrow{font-size:17px;color:var(--dim);font-weight:400}
.rc-gain{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;letter-spacing:2px;color:var(--gold);margin-top:-4px}
.rc-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;letter-spacing:1px}
.rc-tag{flex:0 0 46px;font-size:9px;letter-spacing:2px;color:var(--dim)}
.rc-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;
  border:1px solid var(--line);border-radius:12px;color:var(--fg);white-space:nowrap}
.rc-line.reset .rc-chip{color:var(--dim);border-style:dashed}
.rc-chip svg,.rc-gain svg{width:13px;height:13px;flex:0 0 13px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- skins: one panel, one grid, no sub-menus ---- */
#skinsCard{max-width:352px;gap:10px}
.skinrow{display:flex;flex-direction:column;gap:7px}
.skingrid{display:flex;gap:8px}
.swatch{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  padding:6px;display:flex;flex-direction:column;gap:5px;cursor:pointer;color:var(--fg);font:inherit}
.swatch canvas{width:100%;height:52px;display:block;border-radius:8px}
.swatch .tag{font-size:9px;letter-spacing:1.2px;color:var(--dim);text-align:center}
.swatch.owned .tag{color:var(--fg)}
.swatch.equipped{border-color:var(--gold)}
.swatch.equipped .tag{color:var(--gold)}
.swatch.afford{border-color:var(--accent)}
.setline{font-size:10px;letter-spacing:1.6px;color:var(--dim);text-align:center}
.setline.done{color:var(--gold)}

/* ---- ads, dev, notice ---- */
#adOverlay{z-index:40}
#adBox{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
#adBox .tag{font-size:10px;letter-spacing:3px;color:var(--dim);border:1px solid var(--line);padding:5px 10px;border-radius:6px}
#adBar{width:200px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#adBarFill{height:100%;width:0;background:var(--accent)}
#notice{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
  max-width:88%;padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--dim);font-size:11px;letter-spacing:.8px;
  text-align:center;opacity:0;pointer-events:none;transition:opacity 300ms linear}
#notice.show{opacity:1}
#dev{position:fixed;left:8px;bottom:8px;z-index:50;display:none;flex-wrap:wrap;gap:6px;
  max-width:300px;padding:5px;border-radius:8px;background:var(--surface)}
#dev.show{display:flex}
#dev button{font:inherit;font-size:10px;letter-spacing:1px;padding:6px 8px;
  background:var(--surface2);color:var(--dim);border:1px solid var(--line);border-radius:6px;cursor:pointer}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div id="coins">0</div>
    <button id="themeBtn" class="corner" aria-label="Light or dark">
      <svg id="themeIcon" viewBox="0 0 24 24">
        <circle id="sunDot" cx="12" cy="12" r="4.2"/>
        <path id="sunRays" d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6l-1.6-1.6M7 7 5.4 5.4"/>
        <path id="moon" d="M20 14.4A8.4 8.4 0 0 1 9.6 4 8.4 8.4 0 1 0 20 14.4z" style="display:none"/>
      </svg>
    </button>
    <button id="paletteBtn" class="corner" aria-label="Skins" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.7 1.8-1.7H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3z"/><circle cx="7.6" cy="12.4" r="1.1"/><circle cx="9.9" cy="8.2" r="1.1"/><circle cx="14.6" cy="7.8" r="1.1"/></svg>
    </button>
    <button id="gearBtn" class="corner" aria-label="Settings">
      <!-- a real cog: spokes on a circle read as the sun toggle two buttons away -->
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 13.6a7.4 7.4 0 0 0 0-3.2l2-1.5-2-3.4-2.3 1a7.4 7.4 0 0 0-2.8-1.6L13.8 2h-3.6l-.3 2.9a7.4 7.4 0 0 0-2.8 1.6l-2.3-1-2 3.4 2 1.5a7.4 7.4 0 0 0 0 3.2l-2 1.5 2 3.4 2.3-1a7.4 7.4 0 0 0 2.8 1.6l.3 2.9h3.6l.3-2.9a7.4 7.4 0 0 0 2.8-1.6l2.3 1 2-3.4z"/></svg>
    </button>
    <button id="muteBtn" class="corner" aria-label="Sound">
      <svg id="muteIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="wave2" d="M19 6a8.5 8.5 0 0 1 0 12"/><path id="slash" d="M3 3l18 18" style="display:none"/></svg>
    </button>
  </div>

  <div id="readout">
    <div id="maxroll">MAX ROLL <b id="maxrollN">1</b></div>
    <div id="chips">
      <button id="hotChip" class="chip" type="button">
        <svg viewBox="0 0 14 14"><circle class="ring-bg2" cx="7" cy="7" r="5.4"/><circle id="hotRing" class="ring-fg2" cx="7" cy="7" r="5.4" stroke-dasharray="33.93" stroke-dashoffset="0"/></svg>
        <span id="hotText">HOT HAND</span>
      </button>
    </div>
  </div>

  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="hint"><svg viewBox="0 0 24 24"><path d="M9 11V6.5a1.8 1.8 0 0 1 3.6 0V11m0-1.2a1.6 1.6 0 0 1 3.2 0V12m0-1a1.6 1.6 0 0 1 3.2 0v4.5c0 3-2.2 5.5-5.4 5.5H12c-2.2 0-3.4-1-4.4-2.6L5 13.4a1.7 1.7 0 0 1 2.9-1.7L9 13.5"/></svg></div>
  </div>

  <div id="shop"></div>
</div>

<div id="offlinePanel" class="panel">
  <div class="card">
    <h2>WELCOME BACK</h2>
    <div class="big" id="offAmt">0</div>
    <p id="offLine">You were away.</p>
    <button class="cta" id="offCollect">COLLECT</button>
    <button class="cta ghost" id="offDouble">WATCH AD &middot; DOUBLE IT</button>
  </div>
</div>

<div id="recastPanel" class="panel">
  <div class="card" id="recastCard">
    <h2>RECAST</h2>
    <div class="rc-run" id="rcRun"></div>
    <div class="rc-hero"><span class="from" id="rcFrom"></span><span class="arrow">&rarr;</span><span id="rcTo"></span></div>
    <div class="rc-gain" id="rcGain"></div>
    <div class="rc-line" id="rcKeep"></div>
    <div class="rc-line reset" id="rcReset"></div>
    <div class="row">
      <button class="cta ghost" id="recastNo">CANCEL</button>
      <button class="cta" id="recastYes">RECAST</button>
    </div>
  </div>
</div>

<div id="skinsPanel" class="panel">
  <div class="card" id="skinsCard">
    <h2>SKINS</h2>
    <div class="skinrow">
      <div class="skingrid" id="dieGrid"></div>
      <div class="setline" id="dieSet"></div>
    </div>
    <div class="skinrow">
      <div class="skingrid" id="bgGrid"></div>
      <div class="setline" id="bgSet"></div>
    </div>
    <button class="cta ghost" id="skinsClose">CLOSE</button>
  </div>
</div>

<div id="settingsPanel" class="panel">
  <div class="card">
    <h2>SETTINGS</h2>
    <button class="cta ghost" id="setMute">SOUND: ON</button>
    <button class="cta ghost" id="setTheme">THEME: DARK</button>
    <button class="cta ghost danger" id="setReset">HOLD TO ERASE EVERYTHING</button>
    <p id="resetHint">Hold the button for two seconds. There is no undo.</p>
    <p id="verLine">ONE MORE SIDE &mdash; prototype v2.1</p>
    <button class="cta ghost" id="setClose">CLOSE</button>
  </div>
</div>

<div id="adOverlay" class="panel">
  <div id="adBox">
    <div class="tag">DEV PLACEHOLDER &mdash; NO REAL AD NETWORK</div>
    <div class="big" id="adTitle">REWARD</div>
    <div id="adBar"><div id="adBarFill"></div></div>
  </div>
</div>

<div id="notice"></div>
<div id="dev"></div>

<script id="economy">
/* ============================================================================
   ECONOMY CORE. Pure numbers and state transitions. No DOM, no timers, and no
   string the player ever sees. sim.js extracts this exact block out of the page,
   so the simulator and the game can never disagree about a single constant.
   ========================================================================== */
(function (global) {
'use strict';

/* Currency helpers. Every currency operation goes through these so swapping in
   a bignum later is mechanical rather than a rewrite. */
function add(a, b) { return a + b; }
function sub(a, b) { return a - b; }
function mul(a, b) { return a * b; }
function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
function gte(a, b) { return cmp(a, b) >= 0; }

var K = {
  SAVE_KEY: 'oms.save.v2',
  SAVE_KEY_V1: 'oms.save.v1',
  /* Where an unreadable save is parked, so the first autosave of the fresh game
     that replaced it cannot destroy the only copy. */
  SAVE_KEY_BROKEN: 'oms.save.broken',
  SAVE_VERSION: 2,

  MAX_SIDES: 100,
  MAX_DICE: 3,
  MAX_ROLLER_LEVEL: 11,
  MAX_RECASTS: 3,

  /* Faces read 1..n. One more side multiplies a die's base income by only
     (n+2)/(n+1) - 14% at n=6, 1% at n=99 - so sides are not the growth engine
     any more and their price cannot grow like one. The uniform-spread law says
     roughly 10^(6/98) = 1.152, and the spec rounds that to 1.16 and allows the
     sim 1.12-1.20.
     Measured at 1.16 the hundredth side costs 20.7M and the whole side track
     costs 3.1B per run against a peak income of 13M/min: the reference bot
     reached 100 sides at t=382 min against a 105-minute target and sat in 26
     dead zones, the longest 131 minutes. 1.13 puts the hundredth side at 1.7M,
     100 sides at t=118 and the dead-zone count at zero.
     SIDE_BASE is 13 rather than 10 so the opening drip is ~6 s a side, which is
     the cadence the spec's own 0:00-0:36 script describes; at 10 it was 4.3 s
     and six sides landed at 0.38 min against a 0.6 target. */
  SIDE_BASE: 13,
  SIDE_GROWTH: 1.13,
  SIDE_UNIT_MULT: 4,

  /* x2 SIDE: each purchase doubles one more face, highest first. The mid-game
     engine, worth +83% across the whole 12-purchase track on a 20-side die and
     +22% on a 100-side one - it fades by design. */
  /* Spec values 120 and 2.60. At 2.60 the twelve-step track spans 120 to 4.4M -
     a 37,000x cost range for a track the spec itself values at +22% income on a
     100-side die - and the last few purchases were the worst coins in the game.
     2.00 spans 120 to 246K, which is still a real commitment and is in
     proportion to what the track pays. 90 rather than 120 puts the first x2 at
     1.4 min against the spec's own 1.2. */
  X2_BASE: 90,
  X2_GROWTH: 2.00,
  X2_UNIT_MULT: 4,
  X2_MAX: 12,
  X2_UNLOCK_SIDES: 9,
  TIER_BASE: 2,
  TIER_MAX: 3,
  /* Spec value 25. The x3 tier converts twelve doubled faces into tripled ones,
     worth about +7% on a 100-side die. At 25x the last x2 that is a 23M coin
     card on die 3 and it measured as a single 131-minute wait - on its own,
     most of the prototype's stated length - for a seven percent raise. 6x
     prices it like what it is. */
  TIER3_MULT: 6,

  /* JACKPOT SIDE: face index 0 - the die's "1" - and never a second face.
     Tier t pays JACK_MULT(t) x (n+1)/2, roughly doubling a die's income each
     time. The side gate is what keeps buying sides worth doing all the way to
     100 and what bounds the jackpot's share of a die at 75%. */
  /* Spec value 2500. At 2500 a player who buys only the sides the jackpot gate
     demands and the one roller level its unlock demands reaches the game's
     headline moment at 4.06 min against a 9-minute target - outside the +/-35%
     band on the fast side, and it burns the reveal before the x2 track (the
     whole mid-game) has started. 4000 moves the reference bot 8.60 -> 10.41 min
     and that beeline to about 6.5, both inside the band. 6000 overshoots. */
  JACK_BASE: 4000,
  JACK_GROWTH: 2.80,
  JACK_UNIT_MULT: 4,
  JACK_MULT_BASE: 8,
  JACK_MULT_GROWTH: 1.9,
  JACK_MAX_TIER: 6,
  JACK_UNLOCK_SIDES: 12,
  JACK_SHARE_CAP: 0.75,

  ROLLER_BASE: 600,
  /* Spec value 3.0, which makes the twelfth roller level cost 106M - the single
     most expensive thing in the game and the last dead zone in every run. At
     2.7 it is 44M and no always-open policy has a stretch over 4 minutes with
     nothing to buy, which is invariant 2. */
  ROLLER_GROWTH: 2.7,
  AUTO_BASE: 2.0,
  AUTO_GROWTH: 1.35,

  UNIT_BASE: 5000,
  UNIT_GROWTH: 12,

  COMBO_MULT: 3,
  COMBO_PAIR_MULT: 2,
  /* A die below this size sits the match out entirely. Below the floor a match
     is so likely that growing a die would LOWER expected income, which is the
     trap invariant 1 forbids. */
  COMBO_MIN_SIDES: 6,

  /* Spec value 250000. The reference bot cleared that bar at t=20 min against a
     34-minute target; the doubled 840000 that pays for a flat shard payout
     lands it at 36.3. */
  RECAST_AT: 840000,
  SHARD_COEF: 16,
  SHARD_EXP: 0.45,
  SHARD_VALUE: 0.15,
  /* The number of Recasts is capped at 3 and the shard payout used to grow with
     the size of the bank, so the only correct play was to wait: the card
     lighting at exactly the threshold was telling the player to take the worse
     action, and waiting for 2x finished the game SOONER with a 28% bigger
     multiplier. Capping the RATIO at 2x only moved the ceiling - 12 shards at
     1.0x against 16 at 2.0x, so every coin up to the cap still paid and waiting
     still won on both axes.
     The payout is now FLAT. The ratio saturates at 1, the threshold is doubled
     to pay for it, and a run is worth exactly SHARD_COEF shards the moment the
     card lights - 48 in total, M x8.2. Hoarding past it buys nothing at all, so
     the lit button is the best button BY CONSTRUCTION rather than by
     explanation, which is the only version of this a player can read. */
  SHARD_RATIO_CAP: 1,

  SKIN_DIE_COSTS: [0, 25000, 400000],
  SKIN_BG_COSTS: [0, 60000, 900000],
  SET_BONUS: 0.10,

  UNLOCK_SIDE_COINS: 6,
  UNLOCK_ROLLER_SIDES: 6,
  UNLOCK_UNIT_SIDES: 10,
  UNLOCK_UNIT_ROLLER: 2,

  OFFLINE_MIN_S: 60,
  OFFLINE_RATE: 0.5,
  OFFLINE_CAP_S: 14400,
  OFFLINE_RATE_AD: 1.0,
  OFFLINE_CAP_AD_S: 28800,

  HOT_MULT: 3,
  HOT_DURATION_S: 120,
  HOT_COOLDOWN_S: 1200,
  ADS_RETURN_GATE_S: 1800,

  TAP_COOLDOWN_S: 0.1,
  FAST_ROLL_THRESHOLD: 8
};

/* ---- a single die --------------------------------------------------------
   { n, x2, tier, jack }. Faces are 1..n. Nothing else describes a die.      */

function newDie() { return { n: 1, x2: 0, tier: K.TIER_BASE, jack: 0 }; }

function jackMult(t) {
  if (!(t > 0)) return 0;
  return Math.ceil(K.JACK_MULT_BASE * Math.pow(K.JACK_MULT_GROWTH, t - 1) - 1e-9);
}

/* Smallest side count at which tier t keeps the jackpot's share of THIS die's
   income at or under JACK_SHARE_CAP. The spec prints ~JACK_MULT/3; solving the
   share directly is the same ladder within one side and makes invariant 5
   structural instead of approximate. Never below the unlock. */
var gateCache = {};
function jackGate(t) {
  if (gateCache[t] !== undefined) return gateCache[t];
  var jm = jackMult(t), n, base, jv, found = K.MAX_SIDES;
  for (n = 1; n <= K.MAX_SIDES; n++) {
    base = n * (n + 1) / 2 - 1;
    jv = jm * (n + 1) / 2;
    if (jv <= K.JACK_SHARE_CAP * (base + jv)) { found = n; break; }
  }
  gateCache[t] = Math.max(found, K.JACK_UNLOCK_SIDES);
  return gateCache[t];
}

/* What face index i pays. The jackpot owns index 0; the x2 track owns the top
   `x2` indices. buyable() keeps x2 <= n-1 so the two can never collide. */
function faceValue(die, i) {
  var n = die.n;
  if (die.jack > 0 && i === 0) return jackMult(die.jack) * (n + 1) / 2;
  var v = i + 1;
  if (die.x2 > 0 && i >= n - die.x2) return v * die.tier;
  return v;
}

/* normal | x2 | jack. Colour means face TYPE and nothing else - the landed face
   is shown by position under the marker, never by a colour. */
function faceType(die, i) {
  if (die.jack > 0 && i === 0) return 'jack';
  if (die.x2 > 0 && i >= die.n - die.x2) return 'x2';
  return 'normal';
}

/* E(die) = [ n(n+1)/2 - 1 + jackVal + x2Extra ] / n, the closed form from the
   spec and the only expected value in the codebase. */
function dieExpected(die) {
  var n = die.n;
  var total = n * (n + 1) / 2;
  if (die.jack > 0) total = total - 1 + jackMult(die.jack) * (n + 1) / 2;
  if (die.x2 > 0) total = add(total, (die.tier - 1) * die.x2 * (2 * n - die.x2 + 1) / 2);
  return total / n;
}

function dieMaxFace(die) {
  return Math.max(faceValue(die, 0), faceValue(die, die.n - 1));
}

/* Share of one die's own income that the jackpot face contributes (invariant 5). */
function jackShare(die) {
  if (!die.jack) return 0;
  var all = dieExpected(die) * die.n;
  return all > 0 ? (jackMult(die.jack) * (die.n + 1) / 2) / all : 0;
}

function cloneDie(d) { return { n: d.n, x2: d.x2, tier: d.tier, jack: d.jack }; }

/* ---- cost ladders -------------------------------------------------------- */

function sideCost(unit, n) {
  return Math.ceil(K.SIDE_BASE * Math.pow(K.SIDE_GROWTH, n - 2) *
                   Math.pow(K.SIDE_UNIT_MULT, unit - 1) - 1e-9);
}
function x2Cost(unit, k) {
  return Math.ceil(K.X2_BASE * Math.pow(K.X2_GROWTH, k - 1) *
                   Math.pow(K.X2_UNIT_MULT, unit - 1) - 1e-9);
}
function tier3Cost(unit) { return Math.ceil(K.TIER3_MULT * x2Cost(unit, K.X2_MAX) - 1e-9); }
function jackCost(unit, t) {
  return Math.ceil(K.JACK_BASE * Math.pow(K.JACK_GROWTH, t - 1) *
                   Math.pow(K.JACK_UNIT_MULT, unit - 1) - 1e-9);
}
function rollerCost(level) {
  return Math.ceil(K.ROLLER_BASE * Math.pow(K.ROLLER_GROWTH, level + 1) - 1e-9);
}
function autoRate(level) { return level < 0 ? 0 : K.AUTO_BASE * Math.pow(K.AUTO_GROWTH, level); }
function unitCost(owned) { return K.UNIT_BASE * Math.pow(K.UNIT_GROWTH, owned - 1); }
function skinCost(cat, idx) {
  var list = cat === 'bg' ? K.SKIN_BG_COSTS : K.SKIN_DIE_COSTS;
  return idx >= 0 && idx < list.length ? list[idx] : Infinity;
}

/* ---- multipliers --------------------------------------------------------- */

function globalMult(shards) { return 1 + K.SHARD_VALUE * shards; }

function setsComplete(st) {
  var n = 0, i, ok;
  ok = true; for (i = 0; i < st.skinDie.length; i++) if (!st.skinDie[i]) ok = false;
  if (ok) n++;
  ok = true; for (i = 0; i < st.skinBg.length; i++) if (!st.skinBg[i]) ok = false;
  if (ok) n++;
  return n;
}

/* Everything permanent: shards and completed skin sets. Hot Hand is deliberately
   NOT in here - it must not move the Recast bar or offline earnings. */
function runMult(st) { return globalMult(st.shards) * (1 + K.SET_BONUS * setsComplete(st)); }

/* `nowMs` is Date.now() MILLISECONDS, because that is what hotUntil stores.
   0 is the explicit "no clock, un-buffed please" request that income() and every
   ROI and simulator caller makes, so it must NOT count as a moment before
   hotUntil: `0 < hotUntil` is true for the whole rest of a save once a single
   Hot Hand has ever been taken, which silently tripled every ROI number and
   every simulator invariant from that point on. */
function multiplier(st, nowMs) {
  var m = runMult(st);
  if (nowMs > 0 && nowMs < st.hotUntil) m *= K.HOT_MULT;
  return m;
}

/* Shards only, not the skin-set bonus: completing a set mid-run must never
   switch off a RECAST that is already lit (SPEC Appendix A13). */
function recastThreshold(st) { return K.RECAST_AT * globalMult(st.shards); }

function shardsFor(st) {
  var threshold = recastThreshold(st);
  if (st.runCoins < threshold) return 0;
  var ratio = Math.min(st.runCoins / threshold, K.SHARD_RATIO_CAP);
  return Math.floor(K.SHARD_COEF * Math.pow(ratio, K.SHARD_EXP));
}

/* Equal to the threshold while SHARD_RATIO_CAP is 1: the shard payout is flat,
   so waiting past a lit RECAST earns nothing. Kept only so the RECAST card's
   rising/maxed branch stays dormant rather than deleted. */
function shardsMaxedAt(st) { return recastThreshold(st) * K.SHARD_RATIO_CAP; }

/* ---- combo, and expected value ------------------------------------------
   The combo is one evaluator over the landed-index array - a single payline,
   which is what makes the slot reskin a data change rather than a rewrite.  */

function participants(dice) {
  var p = [], d;
  for (d = 0; d < dice.length; d++) if (dice[d].n >= K.COMBO_MIN_SIDES) p.push(d);
  return p;
}

/* A die that has landed its OWN jackpot face sits the match out. The jackpot
   pays the jackpot and is never also doubled, so a die on it has nothing left
   for a match to multiply - and a match that multiplies nothing must not be
   declared either, or the screen bursts a DOUBLES ×2 tag over two gold dice and
   pays neither of them double. One rule, used by the payout, by the expected
   value and by the renderer, so all three always agree. */
function comboEligible(die, i) {
  return !(die.jack > 0 && i === 0);
}

/* Which dice actually formed the match, so the renderer glows exactly those.
   null when there is no match at all, which is also what makes the tag and the
   glow disappear together. */
function matchedSet(dice, indices) {
  var p = participants(dice), a, b, out = [];
  if (p.length < 2) return null;
  for (a = 0; a < p.length; a++) {
    if (!comboEligible(dice[p[a]], indices[p[a]])) continue;
    for (b = a + 1; b < p.length; b++) {
      if (!comboEligible(dice[p[b]], indices[p[b]])) continue;
      if (indices[p[a]] !== indices[p[b]]) continue;
      if (out.indexOf(p[a]) < 0) out.push(p[a]);
      if (out.indexOf(p[b]) < 0) out.push(p[b]);
    }
  }
  return out.length ? out : null;
}

/* The multiplier the matched set pays: three dice matching pay TRIPLES, any
   pair pays DOUBLES - whatever the number of dice on the table. Paying a pair
   ×3 whenever it was "every participant" made the pair fall to ×2 the moment a
   third die reached COMBO_MIN_SIDES, and that drop outweighed the small die's
   own gain, so + SIDE on it lowered income and a player who refuses that froze
   at 100/100/5 for good (SPEC Appendix A13). */
function comboFor(dice, indices) {
  var set = matchedSet(dice, indices);
  if (!set) return 1;
  return set.length >= 3 ? K.COMBO_MULT : K.COMBO_PAIR_MULT;
}

/* E[ the matched dice's OWN faces . 1{every die in `set` lands the same index} ].
   Exact, and the only place a probability is ever integrated. No Monte Carlo.

   The multiplier lands on the dice that made the match and on nothing else -
   which is exactly what the screen shows, two dice glowing with two multiplied
   floats over them. Applying it to the whole throw instead made the bonus scale
   with a big die that took no part in the match, and then growing one of two
   small dice beside it thinned that match hard enough to cost 10% of income
   over 25 consecutive presses: the coin counter going backwards for minutes on
   the only button the player has. That is exactly what invariant 1 forbids. */
/* Why the jackpot is excluded at all: one jackpot face is worth thousands of
   ordinary ones, so a match that landed on it dwarfed everything else - and
   then growing the OTHER die, which is the only button the player has, thinned
   that match and cost 7.5% of income over thirteen consecutive presses. It is
   also the simpler thing to read on screen: the gold star float is the jackpot,
   the DOUBLES tag is the doubles, and they never argue over the same coins. */

function setOwnEV(dice, set) {
  var minS = Infinity, prod = 1, i, d, s, ok;
  for (i = 0; i < set.length; i++) { minS = Math.min(minS, dice[set[i]].n); prod *= dice[set[i]].n; }
  var total = 0;
  for (i = 0; i < minS; i++) {
    ok = true;
    for (d = 0; d < set.length; d++) if (!comboEligible(dice[set[d]], i)) { ok = false; break; }
    if (!ok) continue;                 // no match is declared, so none is paid
    s = 0;
    for (d = 0; d < set.length; d++) s = add(s, faceValue(dice[set[d]], i));
    total = add(total, s);
  }
  return total / prod;
}

function expectedPayout(dice) {
  var base = 0, d;
  for (d = 0; d < dice.length; d++) base = add(base, dieExpected(dice[d]));
  var p = participants(dice);
  if (p.length < 2) return base;
  if (p.length === 2) return add(base, (K.COMBO_PAIR_MULT - 1) * setOwnEV(dice, p));
  /* Three participants. Writing w_d for the weight a die's own face carries -
     3 when all three match, 2 when it is in the matching pair, 1 otherwise -
     the all-equal terms cancel exactly and what is left is one pair sum:
       E[ sum_d fv_d (w_d - 1) ] = sum over pairs of setOwnEV(pair). */
  var bonus = 0, a, b;
  for (a = 0; a < p.length; a++) {
    for (b = a + 1; b < p.length; b++) bonus = add(bonus, setOwnEV(dice, [p[a], p[b]]));
  }
  return add(base, bonus);
}

/* Share of expected income that comes from the match bonus (invariant 4). */
function comboShare(dice) {
  var base = 0, d;
  for (d = 0; d < dice.length; d++) base = add(base, dieExpected(dice[d]));
  var total = expectedPayout(dice);
  return total > 0 ? (total - base) / total : 0;
}

/* Highest payout a single throw can produce, multipliers excluded. Closed over
   the three cases a payout can take rather than a 100^3 brute force. */
var maxRollCache = {};

function diceKey(dice) {
  var k = '', d;
  for (d = 0; d < dice.length; d++) {
    k += dice[d].n + '.' + dice[d].x2 + '.' + dice[d].tier + '.' + dice[d].jack + '|';
  }
  return k;
}

function maxRoll(dice) {
  var key = diceKey(dice);
  if (maxRollCache[key] !== undefined) return maxRollCache[key];
  var d, i, a, b, c, best = 0, maxf = [], sumMax = 0;
  for (d = 0; d < dice.length; d++) { maxf.push(dieMaxFace(dice[d])); sumMax = add(sumMax, maxf[d]); }
  best = sumMax;                                   // no match: every die on its best face
  var p = participants(dice);
  if (p.length >= 2) {
    var outside = 0, minS = Infinity;
    for (d = 0; d < dice.length; d++) if (p.indexOf(d) < 0) outside = add(outside, maxf[d]);
    for (i = 0; i < p.length; i++) minS = Math.min(minS, dice[p[i]].n);
    for (i = 0; i < minS; i++) {                   // every participant on index i
      var s = 0, okAll = true, w;
      for (d = 0; d < p.length; d++) if (!comboEligible(dice[p[d]], i)) { okAll = false; break; }
      w = okAll ? (p.length >= 3 ? K.COMBO_MULT : K.COMBO_PAIR_MULT) : 1; // jackpot voids it
      for (d = 0; d < p.length; d++) s = add(s, mul(faceValue(dice[p[d]], i), w));
      best = Math.max(best, add(s, outside));
    }
    if (p.length > 2) {                            // exactly a pair on index i
      for (a = 0; a < p.length; a++) {
        for (b = a + 1; b < p.length; b++) {
          var lim = Math.min(dice[p[a]].n, dice[p[b]].n);
          for (i = 0; i < lim; i++) {
            var wp = (comboEligible(dice[p[a]], i) && comboEligible(dice[p[b]], i))
                   ? K.COMBO_PAIR_MULT : 1;
            var s2 = add(outside, add(mul(faceValue(dice[p[a]], i), wp),
                                      mul(faceValue(dice[p[b]], i), wp)));
            for (c = 0; c < p.length; c++) {
              if (c === a || c === b) continue;
              var dc = dice[p[c]], other = 0, j;
              for (j = 0; j < dc.n; j++) { if (j === i) continue; var fv = faceValue(dc, j); if (fv > other) other = fv; }
              s2 = add(s2, other);
            }
            best = Math.max(best, s2);
          }
        }
      }
    }
  }
  maxRollCache[key] = best;
  return best;
}

/* ---- state --------------------------------------------------------------- */

function newState() {
  return {
    v: K.SAVE_VERSION,
    coins: 0,
    runCoins: 0,        // earned since the last Recast, drives shards
    lifetime: 0,        // earned ever, drives the first unlock
    dice: [newDie()],
    slots: 1,
    roller: -1,
    shards: 0,
    recasts: 0,
    throws: 0,
    skinDie: [true, false, false],
    skinBg: [true, false, false],
    equipDie: 0,
    equipBg: 0,
    muted: false,
    theme: 'dark',
    adsUnlocked: false,
    hotUntil: 0,        // absolute wall time, Date.now() MILLISECONDS
    hotReadyAt: 0,      // absolute wall time, Date.now() milliseconds
    pending: null,      // { txId, kind, payload } written BEFORE any ad call
    pendingOffline: 0,
    pendingOfflineSeconds: 0,   // seconds actually PAID for, capped per claim
    pendingOfflineAway: 0,      // raw time away, so the card's two numbers agree
    savedAt: 0
  };
}

function clone(st) { return JSON.parse(JSON.stringify(st)); }

/* ---- purchase targets ----------------------------------------------------
   The player never chooses which die an upgrade lands on, so these four rules
   are the whole of the targeting in the game.                               */

/* Cheapest first - smallest die, ties to the lowest unit index, which is also
   the cheapest ladder - but never a press that would LOWER income while another
   one would not.

   COMBO_MIN_SIDES is a cliff: the press that takes a die from 5 sides to 6
   joins it to the match and thins the match it joins, so it is the one forced
   purchase that can lower income - measured at -1.19% on 18/18/5 down to -0.23%
   on 100/100/5, always recovered by the very next side. The dip itself is
   inside invariant 1's 2% bound and is fine. What was NOT fine is that a player
   who declines income-negative purchases was then locked out of + SIDE on EVERY
   die, because the smallest die is the only target this ever offers: a
   never-prestige save froze at 60/59/5 and bought nothing at all, ever again,
   with half the prototype unreachable. Falling through to the next-smallest die
   when the smallest one would cost income keeps the whole track open and costs
   the reference bot nothing - it grows its dice in lockstep, so the fallback
   almost never fires. */
function sideTarget(st) {
  var order = [], i, j, probe;
  for (i = 0; i < st.dice.length; i++) if (st.dice[i].n < K.MAX_SIDES) order.push(i);
  if (!order.length) return null;
  order.sort(function (a, b) { return st.dice[a].n - st.dice[b].n; });
  var best = order[0], now = expectedPayout(st.dice);
  for (i = 0; i < order.length; i++) {
    probe = [];
    for (j = 0; j < st.dice.length; j++) probe.push(cloneDie(st.dice[j]));
    probe[order[i]].n += 1;
    if (expectedPayout(probe) >= now) { best = order[i]; break; }
  }
  return { unit: best, n: st.dice[best].n + 1, cost: sideCost(best + 1, st.dice[best].n + 1),
           gated: false, needs: 0 };
}

/* Prefer a die that can be bought right now, then the cheapest. A gated target
   is still returned so the card can grey out reading NEEDS <x> SIDES instead of
   vanishing or silently underpaying. */
function pickTarget(list) {
  var best = null, i, c;
  for (i = 0; i < list.length; i++) {
    c = list[i];
    if (!best || (best.gated && !c.gated) ||
        (best.gated === c.gated && c.cost < best.cost)) best = c;
  }
  return best;
}

function x2Target(st) {
  var list = [], i, d, k, needs;
  for (i = 0; i < st.dice.length; i++) {
    d = st.dice[i];
    if (d.x2 >= K.X2_MAX) continue;
    if (d.n < K.X2_UNLOCK_SIDES) continue;
    k = d.x2 + 1;
    needs = Math.max(K.X2_UNLOCK_SIDES, k + 1);   // the x2 track never reaches face 0
    list.push({ unit: i, k: k, cost: x2Cost(i + 1, k), needs: needs, gated: d.n < needs });
  }
  return pickTarget(list);
}

function jackTarget(st) {
  var list = [], i, d, t, needs;
  for (i = 0; i < st.dice.length; i++) {
    d = st.dice[i];
    if (d.jack >= K.JACK_MAX_TIER) continue;
    if (d.n < K.JACK_UNLOCK_SIDES && d.jack === 0) continue;
    t = d.jack + 1;
    needs = jackGate(t);
    list.push({ unit: i, tier: t, cost: jackCost(i + 1, t), needs: needs, gated: d.n < needs });
  }
  return pickTarget(list);
}

function tier3Target(st) {
  var list = [], i, d;
  for (i = 0; i < st.dice.length; i++) {
    d = st.dice[i];
    if (d.tier >= K.TIER_MAX || d.x2 < K.X2_MAX) continue;
    list.push({ unit: i, cost: tier3Cost(i + 1), needs: 0, gated: false });
  }
  return pickTarget(list);
}

function targetFor(st, kind) {
  if (kind === 'side') return sideTarget(st);
  if (kind === 'x2') return x2Target(st);
  if (kind === 'jack') return jackTarget(st);
  if (kind === 'tier3') return tier3Target(st);
  return null;
}

function unlocked(st, kind) {

     cooldown, not cleared: clearing it meant winding the device clock backwards
     and reloading always made Hot Hand ready again, which is the opposite of
     what the cooldown is for. Worst case now is one full cooldown. */
  var now = Date.now();
  fresh.hotUntil = Math.min(Math.max(0, num(fresh.hotUntil, 0)), now + K.HOT_DURATION_S * 1000);
  fresh.hotReadyAt = Math.max(0, num(fresh.hotReadyAt, 0));
  if (fresh.hotReadyAt - now > K.HOT_COOLDOWN_S * 1000) {
    fresh.hotReadyAt = now + K.HOT_COOLDOWN_S * 1000;
  }
  fresh.v = K.SAVE_VERSION;
  return fresh;
}

/* A v1 save described dice as a plain side count with an exponential face
   ladder. v2 faces read 1..n, so the shapes carry over and the values do not.
   Coins, roller level, shards and Recasts are kept; the player is told in one
   line rather than finding their die silently different. */
var migrated = false;

function migrateV1(data) {
  var K = E.K;
  var out = E.newState();
  var units = Array.isArray(data.units) ? data.units.slice(0, K.MAX_DICE) : [1];
  if (!units.length) units = [1];
  out.dice = units.map(function (n) {
    var d = E.newDie();
    d.n = clampInt(n, 1, K.MAX_SIDES, 1);
    return d;
  });
  out.slots = out.dice.length;
  out.coins = Math.max(0, num(data.coins, 0));
  out.runCoins = Math.max(0, num(data.runCoins, 0));
  out.lifetime = Math.max(out.runCoins, num(data.lifetime, 0));
  out.roller = clampInt(data.roller, -1, K.MAX_ROLLER_LEVEL, -1);
  out.shards = Math.max(0, clampInt(data.shards, 0, 1e9, 0));
  out.recasts = clampInt(data.recasts, 0, K.MAX_RECASTS, 0);
  out.throws = Math.max(0, num(data.throws, 0));
  out.muted = !!data.muted;
  out.adsUnlocked = !!data.adsUnlocked;
  out.savedAt = Math.max(0, num(data.savedAt, 0));
  /* a pending claim, an ad reward in flight, the Hot Hand clocks and the theme
     survive too; sanitise() clamps every one of them */
  ['pendingOffline', 'pendingOfflineSeconds', 'pendingOfflineAway', 'pending',
   'hotUntil', 'hotReadyAt'].forEach(function (k) { if (data[k] != null) out[k] = data[k]; });
  if (data.theme === 'light' || data.theme === 'dark') out.theme = data.theme;
  migrated = true;
  return sanitise(out);
}

/* Three outcomes, not two: `null` there was nothing here, `false` there was
   something and it could not be read, a number it loaded and this is the time
   away. The old version collapsed the middle case into "nothing here", which is
   why a half-flushed write - the exact threat model the sanitiser names - both
   skipped the v1 fallback and got overwritten by the first autosave. */
function applyLoaded(raw) {
  if (!raw) return null;
  var data;
  try { data = JSON.parse(raw); } catch (e) { return false; }
  if (!data || typeof data !== 'object') return false;
  if (data.v === E.K.SAVE_VERSION && Array.isArray(data.dice)) st = sanitise(data);
  else if (data.v === 1 && Array.isArray(data.units)) st = migrateV1(data);
  else return false;
  var away = st.savedAt ? (Date.now() - st.savedAt) / 1000 : 0;
  return Math.max(0, away);
}

var saveBroken = false;

/* Park the unreadable text under its own key before anything can save over it.
   It is the player's run; a prototype may fail to read it but it may not throw
   it away without saying so. */
function parkBroken(raw) {
  saveBroken = true;
  try { Store.set(E.K.SAVE_KEY_BROKEN, String(raw).slice(0, 200000)); } catch (e) {}
}

function loadAsync() {
  return Store.getAsync(E.K.SAVE_KEY).then(function (raw) {
    var away = applyLoaded(raw);
    if (typeof away === 'number') return away;
    if (away === false) parkBroken(raw);
    /* fall through to v1 whether v2 was ABSENT or UNREADABLE */
    return Store.getAsync(E.K.SAVE_KEY_V1).then(function (raw1) {
      var a1 = applyLoaded(raw1);
      if (typeof a1 === 'number') { G.dropV1 = true; return a1; }
      if (a1 === false && !saveBroken) parkBroken(raw1);
      return 0;
    }, function () { return 0; });
  }, function () { return 0; });
}

/* ---- audio ---------------------------------------------------------------
   Five blips synthesised in code. No files, no decoding, no latency. */
var Audio2 = (function () {
  var ctx = null;
  function ensure() {
    if (ctx) return ctx;
    var AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { ctx = null; }
    return ctx;
  }
  function blip(type, freq, dur, gain, sweepTo, delay) {
    if (st.muted) return;
    var c = ensure();
    if (!c) return;
    if (c.state === 'suspended') c.resume();
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    unlock: function () { var c = ensure(); if (c && c.state === 'suspended') c.resume(); },
    play: function (name, value) {
      if (name === 'roll') blip('triangle', 210, 0.05, 0.05);
      else if (name === 'land') {
        var f = 330 + Math.min(520, Math.log10(Math.max(1, value || 1)) * 130);
        blip('square', f, 0.07, 0.045);
      } else if (name === 'buy') blip('sine', 680, 0.1, 0.07, 980);
      /* hold-to-buy: one short tick per purchase, a semitone higher each time,
         so thirty purchases read as one rising run instead of thirty chimes */
      else if (name === 'tick') {
        var tf = 520 * Math.pow(2, Math.min(18, value || 0) / 12);
        blip('sine', tf, 0.045, 0.045, tf * 1.12);
      }
      else if (name === 'grow') { blip('sine', 88, 0.22, 0.14); blip('sine', 520, 0.34, 0.08, 1080); }
      else if (name === 'jack') {
        blip('sine', 660, 0.12, 0.08, 990);
        blip('sine', 880, 0.14, 0.07, 1320, 0.09);
        blip('sine', 1320, 0.20, 0.06, 1760, 0.19);
      }
    }
  };
})();

function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---- dom helpers ---------------------------------------------------------- */

function $(sel) { return document.querySelector(sel); }
function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function setText(node, text) { if (node.textContent !== text) node.textContent = text; }

function notice(text) {
  var n = $('#notice');
  n.textContent = text;
  n.classList.add('show');
  if (G.noticeHandle) clearTimeout(G.noticeHandle);
  G.noticeHandle = setTimeout(function () { n.classList.remove('show'); G.noticeHandle = 0; }, 5200);
}

/* ---- ads -----------------------------------------------------------------
   One stub, one rule: the pending-reward record is written to the save BEFORE
   the SDK is called, and the reward is granted on success, failure, timeout or
   a resume that finds the record. A failed ad never costs the player. */
var Ads = {
  forceFail: false,
  showRewarded: function (placement) {
    var fill = $('#adBarFill'), title = $('#adTitle');
    title.textContent = placement;
    /* openPanel, not a bare class toggle: the overlay's box does not cover the
       shop or the canvas, and without G.panelOpen every tap that missed the box
       still rolled the die and bought cards through the ad. */
    openPanel('#adOverlay');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    return new Promise(function (resolve, reject) {
      requestAnimationFrame(function () {
        fill.style.transition = 'width 1000ms linear';
        fill.style.width = '100%';
      });
      setTimeout(function () {
        closePanel('#adOverlay');
        if (Ads.forceFail) reject(new Error('no-fill')); else resolve();
      }, 1000);
    });
  }
};

function withTimeout(promise, ms) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, ms);
    promise.then(function (v) { if (!done) { done = true; clearTimeout(t); resolve(v); } },
                 function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
  });
}

function grantReward(txId, fn) {
  if (!st.pending || st.pending.txId !== txId) return;   // idempotent by txId
  var payload = st.pending.payload;
  st.pending = null;
  fn(payload);
  save();
}

function runRewarded(placement, payload, fn) {
  var txId = 'tx' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
  st.pending = { txId: txId, kind: placement, payload: payload };
  save();                                   // record first, always
  withTimeout(Ads.showRewarded(placement), 6000)
    .then(function () { grantReward(txId, fn); })
    .catch(function () { grantReward(txId, fn); });
}

function resumePendingReward() {
  if (!st.pending) return;
  var p = st.pending;
  if (p.kind === 'OFFLINE DOUBLE') grantReward(p.txId, applyOfflineDouble);
  else if (p.kind === 'HOT HAND') grantReward(p.txId, startHot);
  else st.pending = null;
}

/* ---- theme ---------------------------------------------------------------
   One token set drives the page and the canvas. Switching mode rewrites the
   data-theme attribute, re-reads the tokens, and repaints the background. */

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function dieSkin() { return DIE_SKINS[Math.min(st.equipDie, DIE_SKINS.length - 1)]; }
function bgSkin() { return BG_SKINS[Math.min(st.equipBg, BG_SKINS.length - 1)]; }
function mode() { return st.theme === 'light' ? 'light' : 'dark'; }

function applyTheme() {
  document.documentElement.setAttribute('data-theme', mode());
  var P = THEME.palette;
  P.bg = cssVar('--bg');
  P.surface = cssVar('--surface');
  P.fg = cssVar('--fg');
  P.dim = cssVar('--dim');
  P.accent = cssVar('--accent');
  P.gold = cssVar('--gold');
  P.tint = cssVar('--tint');
  P.hot = cssVar('--hot');
  P.line = cssVar('--line');
  var bg = bgSkin()[mode()];
  P.ground = bg.line;
  P.glow = bg.glow;
  document.body.style.background =
    'linear-gradient(180deg,' + bg.top + ' 0%,' + bg.top + ' 38%,' + bg.bot + ' 100%)';
  /* the pre-paint colour on <html> would otherwise keep the LAUNCH theme under
     any area body does not cover (overscroll, a growing dynamic viewport) */
  document.documentElement.style.background = bg.top;
  var meta = $('#themeColor');
  if (meta) meta.setAttribute('content', bg.top);
  /* the pre-paint hint in <head>: a second, SYNCHRONOUS copy of what the async
     save already holds, so the next launch does not flash the wrong theme */
  try {
    localStorage.setItem('oms.theme', mode());
    localStorage.setItem('oms.themeColor', bg.top);
  } catch (e) {}
  $('#sunDot').style.display = mode() === 'light' ? '' : 'none';
  $('#sunRays').style.display = mode() === 'light' ? '' : 'none';
  $('#moon').style.display = mode() === 'light' ? 'none' : '';
  var tb = $('#setTheme');
  if (tb) tb.textContent = 'THEME: ' + mode().toUpperCase();
  wake();
}

function toggleTheme() {
  st.theme = mode() === 'light' ? 'dark' : 'light';
  applyTheme();
  save();
}

/* ---- geometry ------------------------------------------------------------
   Canvas coordinates, y down. TOP is the fixed marker the landed face rotates
   under; the shape still rests on the ground line, which is what the contact
   depth below is for. */
var TOP = -Math.PI / 2;

function radiusFor(sides, count) {
  var r = Math.min(140, 92 + 0.55 * Math.min(sides, E.K.MAX_SIDES));
  if (count === 2) r *= 0.72;
  else if (count >= 3) r *= 0.58;
  return r;
}

function edgeAngle(sides, index, rot) {
  if (sides <= 1) return TOP + rot;
  return TOP + index * (2 * Math.PI / sides) + rot;
}

/* Rotation that brings face `index` under the marker. */
function rotationFor(sides, index) {
  if (sides <= 1) return 0;
  return -index * (2 * Math.PI / sides);
}

/* Small ring memo. Inside a single drawDie the same (sides, R, rot) is asked for
   by the rim, the fill, the face-type clip, the stroke, the specular clip, the
   pulse, the glow AND once per non-normal face - about twenty rebuilds of a
   100-point cos/sin table per die per frame. Nothing mutates what this returns,
   so handing back the same array is safe.

   It holds FOUR entries, not one, because the motion ghosts defeated a single
   slot: three settle ghosts (or two blur ghosts) redraw the same die at a
   different rot, and each one evicted the real die's entry and was evicted by
   it in turn. At 100 sides and three dice that was 9-12 full rebuilds of the
   table and of the Path2D every frame, all of it thrown away. Four slots cover
   a die plus its ghosts; the key is cheap and the miss path is the old one. */
var PP_SLOTS = 4;
var ppKeys = ['', '', '', ''], ppVals = [null, null, null, null], ppNext = 0;
function polyPoints(sides, R, rot) {
  var key = sides + '|' + R + '|' + rot, s;
  for (s = 0; s < PP_SLOTS; s++) if (ppKeys[s] === key) return ppVals[s];
  var pts = [], k, a;
  for (k = 0; k < sides; k++) {
    a = TOP + Math.PI / sides + k * (2 * Math.PI / sides) + rot;
    pts.push([Math.cos(a) * R, Math.sin(a) * R]);
  }
  ppKeys[ppNext] = key; ppVals[ppNext] = pts;
  ppNext = (ppNext + 1) % PP_SLOTS;
  return pts;
}

/* Rotates a closed outline so it begins at its topmost point. Every shape is
   then walked from the marker in the same direction, which is what makes the
   morph a point-for-point lerp between two shapes that are lined up. */
function startAtTop(pts) {
  var best = 0, i;
  for (i = 1; i < pts.length; i++) if (pts[i][1] < pts[best][1]) best = i;
  var out = pts.slice(best).concat(pts.slice(0, best));
  out.push([out[0][0], out[0][1]]);
  return out;
}

/* Dense outline for any side count, starting at the marker and walking the same
   direction every time so morph samples line up point for point. */
function outline(sides, R) {
  var pts = [], i, a;
  if (sides <= 1) {
    var cut = 0.8;                                 // circle with one flat spot
    var half = Math.acos(cut);
    var start = Math.PI / 2 - half, end = Math.PI / 2 + half;
    pts.push([0, R * cut]);
    for (i = 0; i <= 96; i++) {
      a = end + (2 * Math.PI - (end - start)) * (i / 96);
      pts.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
    return startAtTop(pts);
  }
  if (sides === 2) {
    var h = R * 0.45;                              // lens: two arcs, flips over
    var r = (R * R + h * h) / (2 * h);
    var span = Math.asin(R / r);
    /* Same start point and same winding as the polygon branch: begin at the
       bottom contact, walk to the LEFT tip, over the top, to the right tip and
       back. Emitting the two arcs left-to-right each made a bowtie point order,
       so the 1->2 and 2->3 morphs - the first thing a new player sees - lerped
       through a self-intersecting shear instead of a squash and split. */
    var lower = function (u) {
      var t = Math.PI / 2 + span - 2 * span * u;
      return [r * Math.cos(t), -(r - h) + Math.sin(t) * r];
    };
    var upper = function (u) {
      var t = -Math.PI / 2 - span + 2 * span * u;
      return [r * Math.cos(t), (r - h) + Math.sin(t) * r];
    };
    for (i = 32; i >= 0; i--) pts.push(lower(i / 64));
    for (i = 1; i <= 64; i++) pts.push(upper(i / 64));
    for (i = 63; i >= 32; i--) pts.push(lower(i / 64));
    return startAtTop(pts);
  }
  /* Start at the midpoint of face 0 - the face under the marker - because that
     is the one point guaranteed to lie between the last vertex and the first.
     Starting at the BOTTOM instead (which is where v1's marker was) inserts a
     chord straight through the middle of the shape, and the 3->4 morph lerped
     through a self-intersecting bowtie: the first thing a new player sees. */
  var v = polyPoints(sides, R, 0);
  var topMid = -R * Math.cos(Math.PI / sides);
  pts.push([0, topMid]);
  for (i = 0; i < sides; i++) pts.push(v[i]);
  pts.push([0, topMid]);
  return pts;
}

var unitOutlines = {};
function unitOutline(sides) {
  if (!unitOutlines[sides]) unitOutlines[sides] = outline(sides, 1);
  return unitOutlines[sides];
}

/* How far the lowest point of the shape sits below its centre at rotation `rot`.
   Placing the centre this far above the ground line means a spinning die rides
   on the line instead of cutting through it. */
function bottomOf(sides, R, rot) {
  var lowest = 0, k, a, pts, p, c, s;
  if (sides >= 3) {
    for (k = 0; k < sides; k++) {
      a = TOP + Math.PI / sides + k * (2 * Math.PI / sides) + rot;
      if (Math.sin(a) > lowest) lowest = Math.sin(a);
    }
    return lowest * R;
  }
  pts = unitOutline(sides);
  c = Math.cos(rot); s = Math.sin(rot);
  for (k = 0; k < pts.length; k++) {
    p = pts[k][0] * s + pts[k][1] * c;
    if (p > lowest) lowest = p;
  }
  return lowest * R;
}

function resample(poly, count) {
  var i, segs = [], total = 0;
  for (i = 0; i < poly.length - 1; i++) {
    var dx = poly[i + 1][0] - poly[i][0], dy = poly[i + 1][1] - poly[i][1];
    var len = Math.hypot(dx, dy);
    segs.push(len); total += len;
  }
  var out = [], target, acc = 0, seg = 0;
  for (i = 0; i < count; i++) {
    target = total * (i / count);
    while (seg < segs.length - 1 && acc + segs[seg] < target) { acc += segs[seg]; seg++; }
    var t = segs[seg] > 0 ? (target - acc) / segs[seg] : 0;
    out.push([
      poly[seg][0] + (poly[seg + 1][0] - poly[seg][0]) * t,
      poly[seg][1] + (poly[seg + 1][1] - poly[seg][1]) * t
    ]);
  }
  return out;
}

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
/* No overshoot: a chained morph is one step of a longer swell, and an
   overshoot on every step at 15 a second reads as a wobble, not growth. */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
/* The roll settle: easeOutQuart plus a short overshoot at the very end. One
   function, because steering a roll mid-flight has to invert exactly this. */
function rollEase(t) {
  var e = easeOutQuart(t);
  if (t > 0.9) e += Math.sin((t - 0.9) / 0.1 * Math.PI) * 0.012;
  return e;
}

/* ---- canvas --------------------------------------------------------------- */

var cv = $('#stage'), cx = cv.getContext('2d');
var CW = 360, CH = 350, DPR = 1;
var lastCW = 0, lastCH = 0, lastDPR = 0;

/* Measures the ELEMENT, not the window: every shop card that slides in takes
   64 px off #stageWrap without firing a resize event, and a stale backing store
   stretches the polygons into ellipses. A ResizeObserver drives this; the early
   return makes calling it every frame free. */
function sizeCanvas() {
  var rect = cv.getBoundingClientRect();
  var dpr = Math.min(2.5, globalThis.devicePixelRatio || 1);
  var w = Math.max(1, rect.width), h = Math.max(1, rect.height);
  if (w === lastCW && h === lastCH && dpr === lastDPR) return;
  lastCW = w; lastCH = h; lastDPR = dpr;
  CW = w; CH = h; DPR = dpr;
  cv.width = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wake();
}

function groundY() { return CH * 0.86; }

/* How far a payout float travels, and therefore how much clear canvas has to
   exist above a die. Both the spawn and the rise read this. */
function floatRise() { return Math.min(70, CH * 0.22); }
function floatHeadroom() { return floatRise() + 26; }   // + the tallest glyph

/* One scale factor keeps every die inside the canvas at any width. The headroom
   it reserves is the FLOAT's, not the marker's: at 26px the float - which is the
   payout feedback, and the thing that has to appear over the die that earned it
   - spent its last 45% off the top of the canvas on a 360x740 phone. */
function fitScale(dice) {
  var maxR = 0, i;
  for (i = 0; i < dice.length; i++) maxR = Math.max(maxR, radiusFor(dice[i].n, dice.length));
  var wNeed = dice.length * maxR * 2.25;
  var hNeed = maxR * 2.15;
  return Math.max(0.05, Math.min(1, (CW * 0.94) / wNeed,
                                (groundY() - floatHeadroom()) / hNeed));
}

/* One slot per die of exactly the width fitScale reserved, die centred in its
   slot. The same per-die budget drives the placement and the scale, which is
   what section 9's 2x2 and 3x3 layouts extend rather than replace. */
function unitX(i, count) {
  return CW * 0.03 + (i + 0.5) * (CW * 0.94 / count);
}

/* ---- shape paths ---------------------------------------------------------- */

/* `ctx` here is either a canvas context or a Path2D, which has the same
   moveTo/lineTo/quadraticCurveTo/closePath surface and no beginPath. */
function roundedPolyPath(ctx, pts, radius) {
  var n = pts.length, i;
  if (ctx.beginPath) ctx.beginPath();
  for (i = 0; i < n; i++) {
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    var d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
    var d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    var r = Math.min(radius, d1 / 2, d2 / 2);
    var a = [p1[0] + (p0[0] - p1[0]) * (r / d1), p1[1] + (p0[1] - p1[1]) * (r / d1)];
    var b = [p1[0] + (p2[0] - p1[0]) * (r / d2), p1[1] + (p2[1] - p1[1]) * (r / d2)];
    if (i === 0) ctx.moveTo(a[0], a[1]); else ctx.lineTo(a[0], a[1]);
    ctx.quadraticCurveTo(p1[0], p1[1], b[0], b[1]);
  }
  ctx.closePath();
}

function pointsPath(ctx, pts) {
  var i;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

/* The rounded outline of a polygon, built ONCE and then reused for the rim, the
   fill, both clips, the stroke, the pulse and the glow. At 100 sides each build
   is 100 hypot pairs and 100 quadratic segments, and drawDie used to ask for
   seven of them per die per frame. Null when the browser has no Path2D or the
   shape is not a polygon, and then shapePath() below does it the old way. */
/* Memoised on the same four slots and for the same reason: a ghost pass asks
   for the same shape at a slightly different rot, and rebuilding a 100-segment
   rounded path for each of them was the largest single cost in the frame. */
var spKeys = ['', '', '', ''], spVals = [null, null, null, null], spNext = 0;
function shapePath2D(sides, R, rot) {
  if (sides < 3 || typeof Path2D !== 'function') return null;
  var key = sides + '|' + R + '|' + rot, s;
  for (s = 0; s < PP_SLOTS; s++) if (spKeys[s] === key) return spVals[s];
  var p = new Path2D();
  roundedPolyPath(p, polyPoints(sides, R, rot), Math.min(4, 2 + 60 / sides));
  spKeys[spNext] = key; spVals[spNext] = p;
  spNext = (spNext + 1) % PP_SLOTS;
  return p;
}

function shapePath(ctx, sides, R, rot) {
  if (sides >= 3) {
    roundedPolyPath(ctx, polyPoints(sides, R, rot), Math.min(4, 2 + 60 / sides));
    return;
  }
  var pts = outline(sides, R), i;
  ctx.save();
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.restore();
}

function angleGap(a) {
  var d = (a - TOP) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

/* How the shape reads at this size. 1-13 every face numbered; 14-39 the four
   faces nearest the marker, the rest ticks; 40-100 a near-circle with ticks and
   a value window at the marker. The window is how a 100-sided die stays
   legible - it is not a fallback. */
function readMode(sides) {
  if (sides <= 13) return 'full';
  if (sides <= 39) return 'near';
  return 'window';
}

function labelledFaces(sides, rot) {
  var all = [], i;
  for (i = 0; i < sides; i++) all.push(i);
  if (sides <= 13) return all;
  all.sort(function (a, b) {
    return Math.abs(angleGap(edgeAngle(sides, a, rot))) - Math.abs(angleGap(edgeAngle(sides, b, rot)));
  });
  return all.slice(0, 4);
}

/* ---- the die -------------------------------------------------------------- */

/* `v` is the caller's vertex array, hoisted out of the loop: a 100-side die with
   twelve doubled faces and a jackpot used to rebuild it thirteen times. */
function faceFill(ctx, die, i, skin, v) {
  var type = E.faceType(die, i);
  if (type === 'normal') return;
  var sides = v.length;
  var a = v[(i - 1 + sides) % sides], b = v[i % sides];
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.closePath();
  ctx.globalAlpha = type === 'jack' ? 0.9 : 0.55;
  ctx.fillStyle = type === 'jack' ? THEME.palette.gold : THEME.palette.tint;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawDie(ctx, unitIndex, opts) {
  var sides = opts.sides;
  var R = opts.R;
  var rot = opts.rot;
  var die = opts.die;
  var P = THEME.palette;
  var sk = dieSkin()[mode()];
  var i;

  ctx.save();
  ctx.translate(opts.x, opts.y);
  ctx.scale(opts.sx, opts.sy);
  /* Motion ghosts are the same silhouette a few degrees round, and a rotated
     copy of a path is a TRANSFORM, not a new path. Passing the offset as `spin`
     instead of baking it into rot keeps every pass in the frame on one
     (sides, R, rot) key, so the point table and the Path2D are built once per
     die instead of once per ghost - at 100 sides and three dice that is 3
     builds a frame instead of 12, and the builds are 100 hypot pairs each. */
  if (opts.spin) ctx.rotate(opts.spin);

  /* path() hands back a reusable Path2D when it can and otherwise installs the
     path into the context and returns null; fillP/strokeP/clipP take whichever
     it was. The Path2D is built once and reused by every pass below. */
  var p2d = null, p2dDone = false;
  var path = function () {
    if (opts.morphPts) { pointsPath(ctx, opts.morphPts); return null; }
    if (!p2dDone) { p2dDone = true; p2d = shapePath2D(sides, R, rot); }
    if (p2d) return p2d;
    shapePath(ctx, sides, R, rot);
    return null;
  };
  var fillP = function () { var p = path(); if (p) ctx.fill(p); else ctx.fill(); };
  var strokeP = function () { var p = path(); if (p) ctx.stroke(p); else ctx.stroke(); };
  var clipP = function () { var p = path(); if (p) ctx.clip(p); else ctx.clip(); };

  /* extruded rim: an offset copy of the shape behind the face, darkened. One
     extra fill buys the whole thing its depth. */
  if (!opts.ghost) {
    ctx.save();
    ctx.translate(R * 0.035, R * 0.05);
    ctx.fillStyle = sk.rim;
    fillP();
    ctx.restore();
  }

  if (opts.ghost) {
    ctx.fillStyle = sk.face2;
    fillP();
    ctx.restore();
    return;
  }

  /* soft lighting: one linear gradient across the face, light from upper left */
  var g = ctx.createLinearGradient(-R * 0.75, -R * 0.85, R * 0.7, R * 0.9);
  g.addColorStop(0, sk.face);
  g.addColorStop(0.55, sk.face);
  g.addColorStop(1, sk.face2);
  ctx.fillStyle = g;
  fillP();

  /* face types are painted inside the shape, so a tint never escapes the die.
     Also during a morph: the wedges are clipped to the interpolating outline,
     and dropping them made every doubled face blink out for a whole hold. */
  if (sides >= 3 && (die.x2 > 0 || die.jack > 0)) {
    ctx.save();
    clipP();
    var fv = polyPoints(sides, R, rot);          // one build for the whole loop
    for (i = 0; i < sides; i++) faceFill(ctx, die, i, sk, fv);
    ctx.restore();
  }

  ctx.lineWidth = 2;
  /* The landing flash. Never a fill colour - colour on a face means face TYPE,
     so the only thing saying 'this one just landed' is the edge going bright
     for 120 ms, on top of the fact that it is the face under the marker. */
  ctx.strokeStyle = opts.flash > 0 ? P.accent : sk.rim;
  strokeP();

  /* faint specular arc along the upper-left edges */
  ctx.save();
  clipP();
  var sg = ctx.createLinearGradient(-R, -R, -R * 0.1, R * 0.1);
  sg.addColorStop(0, 'rgba(255,255,255,.34)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(-R, -R, 2 * R, 2 * R);
  ctx.restore();

  /* the + SIDE target pulses: the player never chooses which die grows, so with
     two or three dice this outline is the only cue they get */
  if (opts.pulse) {
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.24 * Math.sin(opts.time * 4);
    ctx.lineWidth = 3;
    ctx.strokeStyle = P.gold;
    strokeP();
    ctx.restore();
  }

  /* a matched die wears a gold rim for the length of the burst */
  if (opts.glow > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, opts.glow * 2);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = P.gold;
    strokeP();
    ctx.restore();
  }

  if (opts.labels) drawFaceMarks(ctx, opts, sides, R, rot, die, sk);
  ctx.restore();
}

function drawFaceMarks(ctx, opts, sides, R, rot, die, sk) {
  var P = THEME.palette;
  var i, f, ang, px, py, rotText;
  var mode2 = readMode(sides);

  /* During the 600 ms + SIDE morph the outline is interpolating between two
     shapes, so per-edge ticks and the four numerals nearest the marker cannot
     be placed on it. The stamped new face and the value window can: both are
     anchored to the marker, not to an edge. Bailing out of the whole function
     meant every side purchase from the fourteenth on - almost all of them -
     morphed into a blank polygon and lost the 1.6x->1.0 numeral stamp the spec
     calls the money shot. */
  var wide = !!opts.morphPts && sides > 13;

  var faces = mode2 === 'window' ? [] : labelledFaces(sides, rot);
  if (wide) {
    faces = (mode2 !== 'window' && opts.stampFace >= 0 && opts.stampFace < sides)
          ? [opts.stampFace] : [];
    /* during a hold the landed face stays readable under the marker */
    if (opts.quiet && mode2 !== 'window' && opts.landed >= 0 && opts.landed < sides &&
        faces.indexOf(opts.landed) < 0) faces.push(opts.landed);
  }
  var edgeLen = sides >= 3 ? 2 * R * Math.sin(Math.PI / sides) : R;

  /* Ticks stand in for every face that has no numeral - but a doubled or
     jackpot face always gets its own, longer and in its own colour. Without
     that, every x2 the player buys past 13 sides was invisible: the wedge tint
     is 3.6 degrees wide on a 100-gon and the numerals are gone.
     Ticks are drawn during a morph too. Past 13 sides a one-side step moves
     each vertex by a fraction of an edge, so a tick on the new edge sits on
     the swelling outline; hiding them turned a two-second hold on a 60-side
     die into two seconds of a blank disc. */
  if (sides >= 3 && faces.length < sides) {
    var step = mode2 === 'window' ? Math.ceil(sides / 40) : 1;
    var thin = Math.max(1, Math.min(2, R * 0.02));
    var thick = Math.max(1.6, Math.min(3.4, R * 0.035));
    ctx.save();
    for (i = 0; i < sides; i++) {
      if (faces.indexOf(i) >= 0) continue;
      var tt = E.faceType(die, i);
      if (tt === 'normal' && (i % step) !== 0) continue;
      ang = edgeAngle(sides, i, rot);
      ctx.lineWidth = tt === 'normal' ? thin : thick;
      ctx.globalAlpha = tt === 'normal' ? 0.34 : 0.95;
      ctx.strokeStyle = tt === 'jack' ? P.gold : tt === 'x2' ? P.tint : sk.ink;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * R * (tt === 'normal' ? 0.78 : 0.66),
                 Math.sin(ang) * R * (tt === 'normal' ? 0.78 : 0.66));
      ctx.lineTo(Math.cos(ang) * R * 0.90, Math.sin(ang) * R * 0.90);
      ctx.stroke();
      /* A pip on the rim as well as the spoke. Past 13 sides the wedge tint is
         a few degrees wide and the tick is one line among a hundred, so a
         player could not see which face they had just bought - the doubled and
         jackpot faces were effectively invisible on the die they were bought
         for. A filled dot survives any side count. */
      if (tt !== 'normal') {
        ctx.beginPath();
        ctx.arc(Math.cos(ang) * R * 0.925, Math.sin(ang) * R * 0.925,
                Math.max(1.8, Math.min(4, R * 0.036)), 0, Math.PI * 2);
        ctx.fillStyle = tt === 'jack' ? P.gold : P.tint;
        ctx.fill();
        /* an ink ring, so the pip reads on skins whose face is close to the
           tint or the gold (dark JADE, dark EMBER, dark BONE) */
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = sk.ink;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (faces.length) {
    var fs = Math.max(9, Math.min(sides === 2 ? 24 : 32,
      (mode2 === 'full' ? edgeLen * 0.42 : R * 0.16)));
    var labelR = sides === 1 ? 0 : sides === 2 ? 0.26 : mode2 === 'full' ? 0.62 : 0.68;
    for (i = 0; i < faces.length; i++) {
      f = faces[i];
      ang = edgeAngle(sides, f, rot);
      px = Math.cos(ang) * R * labelR;
      py = Math.sin(ang) * R * labelR;
      rotText = sides <= 2 ? 0 : ang - Math.PI / 2;
      if (Math.cos(rotText) < 0) rotText += Math.PI;      // keep numerals upright
      var pop = (opts.stampFace === f) ? opts.stampScale : 1;
      var type = E.faceType(die, f);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rotText);
      ctx.scale(pop, pop);
      ctx.globalAlpha = (opts.quiet && f === opts.landed) ? 1 : opts.labelAlpha;
      ctx.font = '600 ' + fs.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = sk.ink;
      ctx.fillText(THEME.faceLabel(f), 0, type === 'normal' ? 0 : -fs * 0.16);
      if (type !== 'normal') {
        ctx.font = '600 ' + (fs * 0.42).toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillText(type === 'jack' ? '★' : '×' + die.tier, 0, fs * 0.44);
      }
      ctx.restore();
    }
  }

  /* the value window: how a 40-to-100-sided die stays readable */
  if (mode2 === 'window') {
    /* On a near-circle there is nowhere to stamp a numeral on the rim, so the
       + SIDE money shot happens in the window instead: it pops showing the new
       highest face at 1.6x and settles to 1.0, which is the whole point of the
       purchase said without a word. */
    var landed = opts.landed;
    if (opts.morphPts && opts.stampFace >= 0 && opts.stampFace < sides) landed = opts.stampFace;
    var type2 = E.faceType(die, landed);
    var label = THEME.faceLabel(landed);
    var wf = Math.max(13, R * 0.30);
    ctx.font = '700 ' + wf.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
    var wWidth = Math.max(ctx.measureText(label).width + wf * 0.9, wf * 1.5);
    var wHeight = wf * 1.35;
    var wy = -R * 0.52;
    ctx.save();
    if (opts.morphPts && opts.stampScale !== 1) {
      ctx.translate(0, wy); ctx.scale(opts.stampScale, opts.stampScale); ctx.translate(0, -wy);
    }
    /* During a hold the window never fades: it counts the new top face up
       41, 42, 43... with a small pulse per step, which is the whole purchase
       said without a word. The numerals on the rim wait for the settle. */
    ctx.globalAlpha = (opts.quiet || opts.fromHold) ? 1 : opts.labelAlpha;
    roundRect(ctx, -wWidth / 2, wy - wHeight / 2, wWidth, wHeight, wHeight * 0.28);
    ctx.fillStyle = type2 === 'jack' ? P.gold : type2 === 'x2' ? P.tint : sk.face2;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = sk.rim;
    ctx.stroke();
    ctx.fillStyle = sk.ink;
    ctx.font = '700 ' + wf.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(label, 0, wy + wf * 0.03);
    if (type2 !== 'normal') {
      ctx.font = '700 ' + (wf * 0.4).toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText(type2 === 'jack' ? '★' : '×' + die.tier, 0, wy + wHeight * 0.62);
    }
    ctx.restore();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

THEME.drawFace = drawDie;

/* ---- roll resolution -----------------------------------------------------
   The simulation resolves the roll and hands the renderer a result. The
   renderer never decides an outcome. */

function frozen() { return clock() < G.freezeUntil; }
function hotActive() { return hotLeftMs() > 0; }

/* The one permanent readout in the game, and the player reads it as "the biggest
   number I can see". E.maxRoll is deliberately multiplier-free, so on its own it
   contradicted the floats printed right under it: after the first Recast every
   payout is at least 2.8x that number, and with both skin sets and Hot Hand it
   is about ten. Multiplied through ECON's own helper, not in the renderer. */
function maxRollNow() { return E.mul(E.maxRoll(st.dice), E.multiplier(st, Date.now())); }

function doRoll(animate) {
  hotLeftMs();                       // re-clamp before any payout reads hotUntil
  var res = E.roll(st, Math.random, Date.now());
  flushLand();                       // the previous throw never goes unpaid
  G.lastResult = res;
  var i;
  for (i = 0; i < st.dice.length; i++) {
    var an = unitAnim(i);
    var sides = st.dice[i].n;
    var target = rotationFor(sides, res.indices[i]);
    if (animate) {
      var from = an.rot;
